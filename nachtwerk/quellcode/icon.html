<!doctype html><html><head><style>
html,body{margin:0;background:transparent}
.i{width:512px;height:512px;position:relative;overflow:hidden;background:radial-gradient(90% 80% at 70% 15%,#a3304f 0%,#5e1428 45%,#1c060d 100%)}
.i.round{border-radius:0}
.glow{position:absolute;left:-20%;bottom:-35%;width:120%;height:80%;background:radial-gradient(circle,rgba(240,179,194,.45),transparent 65%);filter:blur(10px)}
.ring{position:absolute;inset:var(--pad);border-radius:50%;box-shadow:inset 0 2px 3px rgba(255,255,255,.25)}
svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--logo);height:var(--logo);filter:drop-shadow(0 6px 24px rgba(0,0,0,.35))}
.st{position:absolute;border-radius:50%;background:#fff}
</style></head><body>
