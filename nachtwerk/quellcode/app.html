    try{await navigator.clipboard.writeText(txt);
      // Erneuerungs-Schlüssel gelten nur einmal: Nach dem Umzug in die App meldet sich Safari ab
      if(d.copy==="token"){store.del("nw_oura_tok");store.set("nw_oura_moved",1);keepScroll(render);toast("Code kopiert. Jetzt in der App einfügen.");openOv("oura")}else toast(d.copy==="url"?"Adresse kopiert":"Code kopiert")}
    catch(x){const ta=$(d.copy==="token"?"#tokOut":"#codeOut");if(ta){ta.hidden=false;ta.value=txt;ta.select();
      // Safari meldet sich auch hier ab, sonst teilen sich Safari und die App einen Schlüssel, der nur einmal gilt
      if(d.copy==="token"){store.del("nw_oura_tok");store.set("nw_oura_moved",1);keepScroll(render)}
      toast(d.copy==="token"?"Markiert. Kopieren und in der App einfügen":"Markiert. Jetzt kopieren")}}
    return;
  }
  const a=d.act;
  if(a==="close"){closeOv();return}
  if(a==="live"){loadLiveOnce();return}
  if(a==="sync"){if(!OURA.token()){openOv("oura");return}toast("Lade von Oura …");try{await OURA.sync();ouraError=null}catch(x){ouraError=x.message;toast(x.message);if(x.code==="auth"){keepScroll(render);openOv("oura")}else if(ovKind==="oura")openOv("oura")}return}
  if(a==="oura-login"){const c=$("#cidIn"),pi=$("#proxyIn");
    if(pi){const n=normProxy(pi.value);if(n===null){toast("Die Brücken-Adresse sieht so aus: https://name.konto.workers.dev");return}store.set("nw_oura_proxy",n)}
    if(c)store.set("nw_oura_cid",c.value.replace(/\s+/g,""));
    OURA.authorize().catch(x=>toast(x.message));return}
  if(a==="oura-out"){const t=store.get("nw_oura_tok",null);store.del("nw_oura_tok");ouraError=null;OURA.revoke(t);openOv("oura");keepScroll(render);toast("Von Oura getrennt");return}
  if(a==="demo"){DATA=demoData();saveData("demo");rebuild();toast("Beispieldaten geladen");return}
  if(a==="code-apply"){const v=($("#codeIn")||{}).value||"";try{await importCode(v);closeOv()}catch(x){toast(x.message)}return}
  if(a==="export"){const blob=new Blob([JSON.stringify({v:1,d:DATA,diary:diary()},null,1)],{type:"application/json"});
    if(IN_CLAUDE){try{const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:"nachtwerk-"+localKey()+".json",data:blob});return}}catch(x){}const c=await encodeData(DATA);try{await navigator.clipboard.writeText(c);toast("Als Code kopiert")}catch(y){toast("Sichern ist hier nicht möglich")}return}
    const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="nachtwerk-"+localKey()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return}
  if(a==="import-file"){const f=$("#fileIn");f.onchange=async()=>{const file=f.files[0];if(!file)return;try{const o=JSON.parse(await file.text());if(!o.d||!Array.isArray(o.d.sleep))throw 0;DATA=mergeData(SOURCE.kind==="demo"?EMPTY:DATA,o.d);if(o.diary)store.set("nw_diary",{...o.diary,...diary()});saveData("file");rebuild();toast("Datei geladen");closeOv()}catch(x){toast("Die Datei ist keine Nachtwerk-Sicherung")}};f.click();return}
  if(a==="wipe"){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Wirklich alles löschen? Noch mal tippen";return}
    (()=>{try{return Object.keys(localStorage)}catch(e){return []}})().filter(k=>k.startsWith("nw_")).forEach(k=>store.del(k));DATA=mergeData(EMPTY,EMPTY);SOURCE={kind:null,at:null};rebuild();closeOv();toast("Alle Daten gelöscht");return}
  if(a==="install"){const ev=INSTALL.deferred;INSTALL.deferred=null;$("#installHost").innerHTML="";if(ev){try{await ev.prompt();await ev.userChoice}catch(x){}}return}
  if(a==="install-later"){store.set("nw_install_later",Date.now());$("#installHost").innerHTML="";return}
  if(a==="checkin-save"){const key=localKey(),dd=diary();const cur=checkinDraft||dd[key];if(!cur||!cur.r)return;dd[key]={r:cur.r,tags:cur.tags||[],t:Date.now()};store.set("nw_diary",dd);checkinDraft=null;rebuild();toast("Check-in gespeichert");return}
  if(a==="checkin-edit"){const e=diary()[localKey()]||{r:0,tags:[]};checkinDraft={r:e.r,tags:[...(e.tags||[])]};keepScroll(render);return}
  if(a==="notes-save"){const all=store.get("nw_notes",{});all[nightKeyEvening()]={todo:$("#todoIn").value,worry:$("#worryIn").value,t:Date.now()};store.set("nw_notes",all);const k="nw_done_"+nightKeyEvening();const s=store.get(k,[]);if(!s.includes("parken"))store.set(k,[...s,"parken"]);closeOv();keepScroll(render);toast("Geparkt. Gute Nacht");return}
  if(a==="breath-start"){startBreath(d.kind);return}
  if(a==="shuffle-start"){startShuffle();return}
  if(a==="scan-start"){startScan();return}
  if(a==="shift-start"){const from=Math.round(M.wakeMean/15)*15,to=store.get("nw_wake",from);store.set("nw_shift",{from,to,start:localKey()});rebuild();toast("Los geht's: alle 3 Tage 15 Minuten");return}
  if(a==="ics"){const blob=new Blob([makeICS()],{type:"text/calendar"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="nachtwerk-erinnerungen.ics";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Datei öffnen und in den Kalender übernehmen");return}
  if(a==="dst-plan"){store.set("nw_dst",d.date);store.set("nw_dst_delta",Number(d.delta)||-60);keepScroll(render);toast("Eingeplant");return}
  if(a==="shift-stop"){store.del("nw_shift");rebuild();return}
});
document.addEventListener("input",e=>{if(e.target.id==="nameIn"){store.set("nw_name",e.target.value.trim().slice(0,30))}});
document.addEventListener("change",e=>{if(e.target.id==="nameIn")keepScroll(render)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ovKind)closeOv()});

/* Schieben zum Starten */
function initSlider(sl){
  const th=$("#thumb");if(sl.classList.contains("done")){th.style.left=(sl.clientWidth-50)+"px";return}
  let drag=false,x0=0,max=0;
  const set=px=>{th.style.left=(6+px)+"px"};
  const finish=()=>{store.set("nw_started",nightKeyEvening());if(CFG.night!=="aus")document.documentElement.classList.add("night");setTimeout(()=>{keepScroll(render);toast("Abendmodus an. Schlaf gut")},380)};
  th.onpointerdown=e=>{drag=true;x0=e.clientX;max=sl.clientWidth-56;th.setPointerCapture(e.pointerId);th.style.transition="none"};
  th.onpointermove=e=>{if(!drag)return;set(clamp(e.clientX-x0,0,max))};
  const end=e=>{if(!drag)return;drag=false;const px=clamp(e.clientX-x0,0,max);th.style.transition="left .35s cubic-bezier(.22,1,.36,1)";
    if(px>max*.85){set(max);finish()}else set(0)};
  th.onpointerup=end;th.onpointercancel=end;
  th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){e.preventDefault();set(sl.clientWidth-56);finish()}};
}

/* ===== Sternenhimmel ===== */
(function stars(){
  const c=$("#stars"),x=c.getContext("2d");let S=[];
  const size=()=>{const d=Math.min(2,window.devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);
    S=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.1+.2,p:Math.random()*6.28,s:.4+Math.random()}))};
  size();addEventListener("resize",size);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const draw=t=>{x.clearRect(0,0,innerWidth,innerHeight);S.forEach(s=>{x.globalAlpha=.25+.45*(still?.6:(Math.sin(t/1000*s.s+s.p)*.5+.5));x.fillStyle="#fff";x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()});if(!still&&!document.hidden)requestAnimationFrame(draw);else if(!still)document.addEventListener("visibilitychange",()=>requestAnimationFrame(draw),{once:true})};
  requestAnimationFrame(draw);
})();

/* ===== Start ===== */
function tick(){
  // Zeitzone neu lesen: Die App kann über die Zeitumstellung hinweg offen bleiben
  const o=new Date().getTimezoneOffset();if(o!==NOW_OFF){NOW_OFF=o;M=build(DATA)}
  applyDst();applyNight();if(tab==="heute"||tab==="rhythmus")keepScroll(render);
}
(async function start(){
  let redirected=false,tokImported=false;
  if(!IN_CLAUDE){
    redirected=OURA.handleRedirect();
    const h=location.hash;
    if(h.startsWith("#import=")){history.replaceState(null,"",location.pathname+location.search);
      // Anmelde-Codes kommen nur über die Zwischenablage. Ein Link damit stammt nicht von Nachtwerk
      if(/NWT\./.test(h))setTimeout(()=>toast("Anmelde-Codes nur über „Code einfügen“, nie über einen Link."),400);
      else if(confirm("Daten aus diesem Link in Nachtwerk übernehmen? Bestätige nur, wenn du den Link selbst in Nachtwerk erstellt hast.")){
        try{tokImported=(await importCode(h.slice(8)))==="token";if(isIOS()&&!isStandalone())setTimeout(()=>toast("Safari und die installierte App speichern getrennt. Füge den Code in der App ein."),2600)}catch(e){toast(e.message)}}}
  }
  M=build(DATA);
  applyDst();
  render();
  if(IN_CLAUDE) connectLive();
  else if(!redirected&&!tokImported&&OURA.token()&&(!SOURCE.at||Date.now()-SOURCE.at>3*3600e3)) OURA.sync().catch(e=>{ouraError=e.message;if(e.code==="auth")keepScroll(render)});
  setInterval(tick,5*60*1000);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)return;tick();if(ovKind==="wach")OVINIT.wach.check?.()});
})();
</script>
