<title>Nachtwerk Schlaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: Desktop = Hero links, Phone-Frame rechts mit der App. Handy = die App füllt den Bildschirm.
   Eine Nachtwelt in Weinrot, bewusst nur dunkel. Ab dem Abend legt sich ein warmer Nachtfilter darüber. */
:root{
  --night:#12050a;        /* tiefster Grund */
  --wine:#5e1428;         /* Weinrot */
  --wine-hi:#8c2440;      /* helles Weinrot */
  --rose:#f0b3c2;         /* Akzent auf Glas */
  --gold:#e6c873;         /* Atem-Glühen */
  --ink:#ffffff;
  --good:#9fe0b8; --warn:#f5d27a; --bad:#ff9aa8;
  --font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
a{color:var(--rose)}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}

/* ---------- Nachthimmel ---------- */
.sky{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,#3a0c1c 0%,var(--night) 60%)}
.sky .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.sky .b1{width:70%;height:55%;left:-15%;top:-10%;background:radial-gradient(circle,#9b2a4a 0%,transparent 70%)}
.sky .b2{width:65%;height:60%;right:-20%;top:25%;background:radial-gradient(circle,#6a1830 0%,transparent 70%);animation-duration:32s}
.sky .b3{width:80%;height:50%;left:10%;bottom:-25%;background:radial-gradient(circle,#c0506e 0%,transparent 65%);opacity:.45;animation-duration:38s}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.sky .veil{position:absolute;inset:0;background:rgba(94,20,40,.3)}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6%,4%,0) scale(1.12)}}
.page-sky{position:fixed;inset:0;z-index:0}

/* ---------- Liquid Glass ---------- */
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before,.liquid-glass-selected::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.liquid-glass-selected{background:rgba(255,255,255,.12);background-blend-mode:luminosity;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 2px rgba(255,255,255,.2);position:relative;overflow:hidden}
.liquid-glass-selected::before{background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.25) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.25) 80%,rgba(255,255,255,.6) 100%)}

/* ---------- Seite ---------- */
.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topnav{display:none}
.hero{display:none}
.wrap{flex:1;display:flex;min-height:0}

/* ---------- Gerät / App ---------- */
.device{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
.device>.sky{z-index:0}
.island{display:none}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 120px);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.appbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:10px}
.logo{width:30px;height:30px;fill:#fff;flex:none}
.circle-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;position:relative;flex:none}
.circle-btn .ic{width:20px;height:20px;color:rgba(255,255,255,.85)}

.badge{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:8px 14px 8px 8px;font-size:12px;font-weight:400;color:rgba(255,255,255,.85)}
.badge .dots{display:flex}
.badge .dots span{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.2);background:linear-gradient(160deg,var(--wine-hi),var(--wine));margin-left:-7px}
.badge .dots span:first-child{margin-left:0}
.badge .dots .ic{width:11px;height:11px;stroke-width:2;color:#fff}
.pulse{width:7px;height:7px;border-radius:99px;background:var(--warn);flex:none;animation:ping 2.4s infinite}
.pulse.live{background:var(--good)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

.eyebrow{font-size:13px;color:rgba(255,255,255,.6);font-weight:400;margin:0 0 6px}
h1.title{font-size:30px;line-height:1.08;font-weight:400;letter-spacing:-.04em;margin:0;text-wrap:balance}
h1.title em{font-style:normal;color:var(--rose)}
h2.sec{font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.sec small{font-size:11px;letter-spacing:.02em;text-transform:none;color:rgba(255,255,255,.45);font-weight:400}
p.lead{font-size:14px;font-weight:300;line-height:1.55;color:rgba(255,255,255,.75);margin:10px 0 0}

.card{border-radius:28px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .k{font-size:11px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase}
.stat .v{font-size:24px;font-weight:400;letter-spacing:-.03em;margin-top:8px}
.stat .v small{font-size:13px;color:rgba(255,255,255,.55);font-weight:300;margin-left:2px}
.stat .d{font-size:12px;font-weight:300;color:rgba(255,255,255,.6);margin-top:4px}

/* Score-Ring */
.ringbox{display:flex;align-items:center;gap:20px;margin-top:22px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:48px;font-weight:300;letter-spacing:-.05em;line-height:1}
.ring .lbl{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;line-height:1.35}
.ring-arc{transition:stroke-dashoffset 1.6s cubic-bezier(.22,1,.36,1)}
.ringside{min-width:0;display:flex;flex-direction:column;gap:10px}
.mini{display:flex;flex-direction:column}
.mini b{font-size:18px;font-weight:400;letter-spacing:-.02em}
.mini span{font-size:11px;color:rgba(255,255,255,.55)}

/* Fortschritt */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row b{font-size:15px;font-weight:500}
.row span{font-size:12px;color:rgba(255,255,255,.6);text-align:right}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:12px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--wine-hi),var(--rose));transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.track.warn i{background:linear-gradient(90deg,#9c5a2a,var(--warn))}
.track.bad i{background:linear-gradient(90deg,#8c2440,var(--bad))}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.45);margin-top:6px}

.lever{display:flex;gap:14px;align-items:flex-start}
.lever .icw{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;flex:none;background:rgba(240,179,194,.14)}
.lever .icw .ic{color:var(--rose)}
.lever h3{margin:0;font-size:15px;font-weight:500;letter-spacing:-.01em}
.lever p{margin:4px 0 0;font-size:13px;font-weight:300;line-height:1.5;color:rgba(255,255,255,.72)}

.cta{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 22px;font-size:14px;font-weight:500;transition:background .3s}
.cta:hover{background:rgba(255,255,255,.1)}
.cta.solid{background:#fff;color:#2b1a1f}
.cta.solid:hover{background:#ffe9ee}
.cta .ic{width:16px;height:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.link{color:var(--rose);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* Charts */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:rgba(255,255,255,.5);font-size:9px;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:rgba(255,255,255,.65);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cardhead h3{margin:0;font-size:15px;font-weight:500}
.cardhead span{font-size:12px;color:rgba(255,255,255,.55);text-align:right}
.note{font-size:12.5px;font-weight:300;line-height:1.5;color:rgba(255,255,255,.7);margin:10px 0 0}
.tiny{font-size:11px;color:rgba(255,255,255,.45);line-height:1.45;margin-top:8px}

/* Faktoren */
.factors{display:flex;flex-direction:column;gap:10px}
.factor{border-radius:24px;padding:16px 18px;text-align:left;width:100%}
.factor .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.factor .name{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;min-width:0}
.factor .name .ic{width:17px;height:17px;color:rgba(255,255,255,.75)}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:99px;flex:none}
.chip.good{color:var(--good);background:rgba(159,224,184,.12)}
.chip.ok{color:var(--warn);background:rgba(245,210,122,.12)}
.chip.bad{color:var(--bad);background:rgba(255,154,168,.13)}
.chip.info{color:rgba(255,255,255,.7);background:rgba(255,255,255,.08)}
.factor .val{font-size:22px;font-weight:400;letter-spacing:-.03em;margin-top:10px}
.factor .val small{font-size:12px;font-weight:300;color:rgba(255,255,255,.55);margin-left:6px;letter-spacing:0}
.factor .why{font-size:12.5px;font-weight:300;line-height:1.5;color:rgba(255,255,255,.7);margin-top:6px}
.factor .do{font-size:12.5px;line-height:1.5;color:var(--rose);margin-top:8px;font-weight:400}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button,.pillbtn{border-radius:99px;padding:8px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,.85)}

/* Wissen */
details.know{border-radius:22px;padding:0}
details.know summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:500}
details.know summary::-webkit-details-marker{display:none}
details.know summary .ic{color:var(--rose)}
details.know summary .chev{margin-left:auto;transition:transform .3s;color:rgba(255,255,255,.5)}
details.know[open] summary .chev{transform:rotate(180deg)}
details.know .kb{padding:0 18px 16px 48px;font-size:13px;font-weight:300;line-height:1.55;color:rgba(255,255,255,.78)}
details.know .kb p{margin:0 0 8px}
details.know .src{font-size:11px;color:rgba(255,255,255,.45)}

/* Abend / Plan */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal{border-radius:32px;height:100px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .2s}
.goal:active{transform:scale(.97)}
.goal .n{font-size:11px;font-weight:500;color:rgba(255,255,255,.5)}
.goal .t{font-size:15px;font-weight:500;line-height:1.2}
.timeline{display:flex;flex-direction:column;margin-top:4px}
.tl{display:grid;grid-template-columns:52px 18px 1fr;gap:10px;align-items:start;text-align:left;width:100%}
.tl .time{font-size:13px;font-weight:500;padding-top:14px;color:rgba(255,255,255,.85)}
.tl .rail{position:relative;height:100%;min-height:62px}
.tl .rail:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.15)}
.tl .rail i{position:absolute;left:2px;top:16px;width:13px;height:13px;border-radius:99px;border:1.5px solid rgba(255,255,255,.5);background:var(--night);transition:all .3s}
.tl.now .rail i{border-color:var(--gold);box-shadow:0 0 10px rgba(230,200,115,.6)}
.tl.done .rail i{background:var(--rose);border-color:var(--rose);box-shadow:0 0 12px rgba(240,179,194,.7)}
.tl .body{padding:12px 0}
.tl .body b{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.tl .body b .ic{width:15px;height:15px;color:rgba(255,255,255,.6)}
.tl .body span{font-size:12.5px;font-weight:300;color:rgba(255,255,255,.65);line-height:1.45;display:block;margin-top:2px}
.tl.done .body b{color:rgba(255,255,255,.55);text-decoration:line-through;text-decoration-color:rgba(240,179,194,.6)}
.tune{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tune .ctrl{display:flex;align-items:center;gap:10px}
.tune .ctrl b{font-size:26px;font-weight:300;letter-spacing:-.03em;min-width:78px;text-align:center}
.tune .ctrl button{width:38px;height:38px;border-radius:99px;display:grid;place-items:center}
.tune .ctrl .ic{width:16px;height:16px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px}
.tool .ic{width:22px;height:22px;color:var(--rose)}
.tool b{font-size:14px;font-weight:500;line-height:1.25}
.tool span{font-size:11.5px;font-weight:300;color:rgba(255,255,255,.6);line-height:1.4}
.tool.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tool.wide>div{display:flex;flex-direction:column;gap:3px}

.voice{display:flex;flex-direction:column;align-items:center;margin:22px 0}
.voice .glow{position:relative;width:150px;height:110px;display:grid;place-items:center}
.voice .glow:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(230,200,115,.5) 0%,rgba(180,140,60,.2) 40%,transparent 70%);animation:breathe 6s ease-in-out infinite}
.voice button{width:64px;height:64px;border-radius:99px;display:grid;place-items:center}
.voice .lab{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
@keyframes breathe{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.1);opacity:1}}

.slider{position:relative;height:56px;border-radius:999px;margin-top:8px;user-select:none;-webkit-user-select:none;touch-action:none}
.slider .thumb{position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:99px;background:#fff;display:grid;place-items:center;z-index:2;cursor:grab;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.slider .thumb .ic{color:#2b1a1f}
.slider .label{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:500;color:rgba(255,255,255,.6);pointer-events:none;padding-left:40px}
.slider .chev{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none}
.slider .chev .ic{width:14px;height:14px}
.slider.done .label{color:var(--rose)}

/* Check-in */
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.rate button{border-radius:18px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:rgba(255,255,255,.7)}
.rate button b{font-size:18px;font-weight:400;color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tags button{border-radius:99px;padding:8px 12px;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:rgba(255,255,255,.85)}
.tags button .ic{width:14px;height:14px}

/* Formulare */
.glass-input{display:block;width:100%;resize:vertical;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.07);padding:12px 14px;color:#fff;font:inherit;font-size:15px;line-height:1.45;outline:none}
.glass-input::placeholder{color:rgba(255,255,255,.4)}
.glass-input:focus{border-color:rgba(255,255,255,.5)}
label.fl{display:block;font-size:12px;color:rgba(255,255,255,.6);margin:14px 0 6px}
.seg{display:flex;border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:99px;padding:9px 0;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.7)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}

/* Tabbar */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;background:rgba(18,5,10,.38)}
.tabbar button{border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:10px;font-weight:500;color:rgba(255,255,255,.55);transition:color .3s,background .3s}
.tabbar button .ic{width:19px;height:19px}
.tabbar button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}

/* Overlays */
.ov{position:absolute;inset:0;z-index:8;background:rgba(10,3,6,.86);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .4s;display:flex;flex-direction:column}
.ov.open{opacity:1;pointer-events:auto}
.ov .ovhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 8px}
.ov .ovhead h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
.ov .ovbody{flex:1;overflow-y:auto;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 28px);scrollbar-width:none}
.ov .ovbody::-webkit-scrollbar{display:none}
.ov .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px}
.orb{width:180px;height:180px;border-radius:999px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(230,200,115,.25) 35%,rgba(140,36,64,.4) 70%);box-shadow:0 0 80px rgba(230,200,115,.35);transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out}
.phase{font-size:24px;font-weight:300;letter-spacing:-.02em}
.count{font-size:13px;color:rgba(255,255,255,.6)}
.bigword{font-size:40px;font-weight:300;letter-spacing:-.03em;transition:opacity 1.2s}
.wake-ov{background:#000}
.wake-ov .center{color:#7a2a2a}
.wake-ov .center p{max-width:300px;font-size:15px;line-height:1.6;margin:0}
.wake-ov .circle-btn .ic{color:#7a2a2a}
.wake-ov .pillbtn{color:#a33a3a;border:1px solid #3a1010}
.menu-links{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.menu-links button{border-radius:20px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.8)}
.set{border-radius:24px;padding:16px 18px;margin-top:12px}
.set h3{margin:0 0 4px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.set h3 .ic{width:16px;height:16px;color:var(--rose)}
.set p{margin:4px 0 0;font-size:12.5px;font-weight:300;line-height:1.5;color:rgba(255,255,255,.7)}
.set ol{margin:8px 0 0;padding-left:18px;font-size:12.5px;font-weight:300;line-height:1.55;color:rgba(255,255,255,.75)}
.set code{font-size:11.5px;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;word-break:break-all}

/* Hinweise */
.srcbar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:14px;flex-wrap:wrap}

<script>
/*ICONS*/
/* ===== Datenstand ===== */
const SNAP = /*SNAP*/null/*END*/;
const PWA_URL = "https://ferdawsyousuf-stack.github.io/psychologie-lern-app/nachtwerk/";
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");
const IS_PWA = !!window.NW_PWA;

/* ===== Hilfen ===== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ic=(n,cls="")=>`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||""}</svg>`;
const avg=a=>{const b=a.filter(x=>x!=null&&!isNaN(x));return b.length?b.reduce((s,x)=>s+x,0)/b.length:null};
const sd=a=>{const b=a.filter(x=>x!=null&&!isNaN(x));if(b.length<2)return 0;const m=avg(b);return Math.sqrt(avg(b.map(x=>(x-m)**2)))};
const pad=n=>String(n).padStart(2,"0");
const hm=min=>{if(min==null||isNaN(min))return "–";const neg=min<0;min=Math.abs(Math.round(min));return (neg?"−":"")+Math.floor(min/60)+" h "+pad(min%60)};
const clock=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
// Nach dem Zurückstellen im Herbst werden Sommer-Nächte in Körperzeit gelesen: 01:38 Sommerzeit zählt im
// Winter als 00:38. So bleibt der Rhythmus gleich und du wirst ohne Mühe eine Stunde früher. Im Frühjahr
// bleiben die Uhrzeiten, wie sie waren: Dort passt du dich an die Uhr an (siehe dstCard).
let NOW_OFF=new Date().getTimezoneOffset();
const minOfDay=iso=>{const d=new Date(iso),off=d.getTimezoneOffset(),corr=off<NOW_OFF?off-NOW_OFF:0;return ((d.getHours()*60+d.getMinutes()+corr)%1440+1440)%1440};
const bedMin=iso=>{let m=minOfDay(iso);if(m<12*60)m+=1440;return m}; // Minuten ab Mitternacht des Vortags
const localKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(key,n)=>{const d=new Date(key+"T12:00:00");d.setDate(d.getDate()+n);return localKey(d)};
const nightKeyEvening=(d=new Date())=>d.getHours()>=12?addDays(localKey(d),1):localKey(d); // Datum der kommenden Nacht
const fmtDate=s=>{const [y,m,d]=s.split("-");return d+"."+m+"."};
const weekday=s=>new Date(s+"T12:00:00").getDay();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),Math.max(2400,t.length*55))}

/* ===== Einstellungen ===== */
const CFG={
  get name(){return store.get("nw_name",IN_CLAUDE?"Ferdaws":"")},
  get need(){return store.get("nw_need",450)},            // Schlafbedarf in Minuten
  get win(){return store.get("nw_win",0)},               // Anpassung des Schlaffensters durch den Wochen-Coach
  get night(){return store.get("nw_nightmode","auto")},  // auto | an | aus
};

/* ===== Daten =====
   Schlaf: [Datum, Start, Ende, Schlaf min, REM, Tief, Leicht, Wach, Effizienz %, Einschlafdauer s, tiefster Puls, HRV, Schlafwert, Atemfrequenz]
   Readiness: [Datum, Wert, Schlafbalance, HRV-Balance, Erholungsindex, Ruhepuls, Vornacht, Aktivitätsbalance, Temperatur-Abw.]
   Aktivität: [Datum, Wert, Schritte, aktive kcal]   SpO2: [Datum, SpO2 %, Atemstörungsindex] */
const EMPTY={sleep:[],ready:[],act:[],spo2:[]};
// Jede Zeile wird geprüft: Datum im Format JJJJ-MM-TT, Zeitpunkte gültig, alles andere Zahlen oder leer.
// So kann ein fremder Code oder Link keinen Text in die Seite schmuggeln.
const ISO_D=/^\d{4}-\d{2}-\d{2}$/, numOr=v=>v==null||v===""||typeof v==="boolean"||!Number.isFinite(+v)?null:+v;
function cleanRows(D){
  D=D&&typeof D==="object"?D:{};
  const arr=x=>Array.isArray(x)?x:[], ok=r=>Array.isArray(r)&&typeof r[0]==="string"&&ISO_D.test(r[0]);
  const iso=v=>{const t=typeof v==="string"||typeof v==="number"?Date.parse(v):NaN;return isNaN(t)?null:new Date(t).toISOString()};
  return {
    sleep:arr(D.sleep).filter(r=>ok(r)&&iso(r[1])&&iso(r[2])).map(r=>[r[0],iso(r[1]),iso(r[2]),...r.slice(3,14).map(numOr)]),
    ready:arr(D.ready).filter(ok).map(r=>[r[0],...r.slice(1,9).map(numOr)]),
    act:arr(D.act).filter(ok).map(r=>[r[0],...r.slice(1,4).map(numOr)]),
    spo2:arr(D.spo2).filter(ok).map(r=>[r[0],...r.slice(1,3).map(numOr)]),
  };
}
function mergeData(a,b){
  a=cleanRows(a);b=cleanRows(b);
  const out={};
  const keyed=(arr,kf)=>{const m=new Map();arr.forEach(r=>m.set(kf(r),r));return m};
  out.sleep=[...keyed([...(a.sleep||[]),...(b.sleep||[])],r=>r[0]+"|"+new Date(r[1]).getTime()).values()];
  ["ready","act","spo2"].forEach(k=>{out[k]=[...keyed([...(a[k]||[]),...(b[k]||[])],r=>r[0]).values()]});
  const cut=addDays(localKey(),-200);
  Object.keys(out).forEach(k=>out[k]=out[k].filter(r=>r[0]>=cut).sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0));
  return out;
}
let DATA=mergeData(EMPTY,store.get("nw_data",EMPTY));
if(SNAP) DATA=mergeData(SNAP,DATA);
let SOURCE=store.get("nw_source",{kind:SNAP?"snap":null,at:null});
function saveData(src){store.set("nw_data",DATA);if(src){SOURCE={kind:src,at:Date.now()};store.set("nw_source",SOURCE)}}

/* ===== Modell ===== */
let M=null;
function build(D){
  const rows=D.sleep.map(r=>({date:r[0],start:r[1],end:r[2],total:r[3],rem:r[4],deep:r[5],light:r[6],awake:r[7],eff:r[8],lat:r[9]??null,low:r[10],hrv:r[11],score:r[12],breath:r[13]??null}));
  const byDate={};rows.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r)});
  const nights=[],dozes=[],naps=[];
  Object.keys(byDate).sort().forEach(d=>{
    const list=byDate[d].slice().sort((a,b)=>b.total-a.total);
    const main=list[0]; if(!main||main.total<120) return;
    nights.push(main);
    list.slice(1).forEach(r=>{
      if(r.total<5) return;
      const sh=new Date(r.start).getHours();
      if(new Date(r.end)<=new Date(main.start)&&(sh>=17||sh<3)) dozes.push(r); else naps.push(r);
    });
  });
  if(nights.length<3) return null;
  const N=nights.slice(-30), first=N[0].date, last=N[N.length-1];
  const D30=dozes.filter(r=>r.date>=first), naps30=naps.filter(r=>r.date>=first);
  const ready=D.ready.map(r=>({date:r[0],score:r[1],sleepBal:r[2],hrvBal:r[3],recovery:r[4],rhr:r[5],prev:r[6],actBal:r[7],temp:r[8]})).slice(-30);
  const act=D.act.map(r=>({date:r[0],score:r[1],steps:r[2],kcal:r[3]})).slice(-30);
  const spo2=(D.spo2||[]).map(r=>({date:r[0],pct:r[1],bdi:r[2]})).slice(-30);
  const need=CFG.need;
  const beds=N.map(n=>bedMin(n.start)), wakes=N.map(n=>minOfDay(n.end));
  const bedMean=avg(beds), bedSd=sd(beds), wakeMean=avg(wakes), wakeSd=sd(wakes);
  const early=N.filter(n=>bedMin(n.start)<=bedMean), late=N.filter(n=>bedMin(n.start)>bedMean+20);
  const pairs=act.map(a=>({a,n:N.find(n=>n.date===addDays(a.date,1))})).filter(p=>p.n);
  const hiAct=pairs.filter(p=>p.a.steps>=9000), loAct=pairs.filter(p=>p.a.steps<5000);
  const withDoze=N.filter(n=>D30.some(z=>z.date===n.date)), noDoze=N.filter(n=>!D30.some(z=>z.date===n.date));
  // Schlafschuld: 14 Nächte, die letzte Nacht zählt voll, ältere Nächte weniger
  const L14=N.slice(-14);let debt=0;
  L14.forEach((n,i)=>{const w=0.35+0.65*(i/(Math.max(1,L14.length-1)));debt+=w*(need-Math.min(n.total,need+60))}); // Plus-Nächte zählen höchstens +1 h
  debt=Math.max(0,debt);
  // Chronotyp nach MCTQ: Schlafmitte an freien Tagen (Nächte vor Sa/So), korrigiert um Ausschlafen
  const onsetMin=n=>bedMin(n.start)+Math.round((n.lat||0)/60);
  const sleepDur=n=>(new Date(n.end)-new Date(n.start))/6e4-Math.round((n.lat||0)/60);
  const mid=n=>onsetMin(n)+sleepDur(n)/2;
  const free=N.filter(n=>[0,6].includes(weekday(n.date))), work=N.filter(n=>![0,6].includes(weekday(n.date)));
  const MSF=avg(free.map(mid)), MSW=avg(work.map(mid)), SDf=avg(free.map(sleepDur)), SDw=avg(work.map(sleepDur));
  let MSFsc=MSF;
  if(MSF!=null&&SDw!=null&&SDf>SDw) MSFsc=MSF-0.5*(SDf-(5*SDw+2*SDf)/7);
  const midAll=avg(N.map(mid));
  const chrono=MSFsc??midAll;
  const sjl=(MSF!=null&&MSW!=null)?Math.abs(MSF-MSW):null;
  // Schlaf-Regelmäßigkeit (SRI): gleicher Zustand (Schlaf/wach) zur gleichen Uhrzeit an aufeinanderfolgenden Tagen
  const sri=calcSRI(rows,N);
  // Konsistenz-Serie: Nächte in Folge mit Einschlafen im Zielfenster ±30 min
  const target=planTimes(wakeMean).bed;
  let streak=0;for(let i=N.length-1;i>=0;i--){if(Math.abs(bedMin(N[i].start)-target)<=30)streak++;else break}
  const inWin=N.slice(-14).filter(n=>Math.abs(bedMin(n.start)-target)<=30).length;
  const m={
    N,last,dozes:D30,naps:naps30,ready,act,spo2,need,
    avgTotal:avg(N.map(n=>n.total)),avgScore:avg(N.map(n=>n.score)),avgDeep:avg(N.map(n=>n.deep)),avgRem:avg(N.map(n=>n.rem)),avgLight:avg(N.map(n=>n.light)),
    avgAwake:avg(N.map(n=>n.awake)),avgEff:avg(N.map(n=>n.eff)),avgLat:(v=>v==null?null:v/60)(avg(N.map(n=>n.lat))),avgHrv:avg(N.map(n=>n.hrv)),avgLow:avg(N.map(n=>n.low)),
    avgBreath:avg(N.map(n=>n.breath)),breathSd:sd(N.map(n=>n.breath)),avgTib:avg(N.map(n=>(new Date(n.end)-new Date(n.start))/6e4)),
    hrv7:avg(N.slice(-7).map(n=>n.hrv)),bedMean,bedSd,wakeMean,wakeSd,
    scoreEarly:avg(early.map(n=>n.score)),scoreLate:avg(late.map(n=>n.score)),nEarly:early.length,nLate:late.length,
    deepHi:avg(hiAct.map(p=>p.n.deep)),deepLo:avg(loAct.map(p=>p.n.deep)),nHi:hiAct.length,nLo:loAct.length,
    scoreDoze:avg(withDoze.map(n=>n.score)),scoreNoDoze:avg(noDoze.map(n=>n.score)),nDoze:withDoze.length,
    dozeCmp:withDoze.length>=3&&noDoze.length>=3?{on:avg(withDoze.map(onsetMin))-avg(noDoze.map(onsetMin)),awake:avg(withDoze.map(n=>n.awake))-avg(noDoze.map(n=>n.awake)),deep:avg(withDoze.map(n=>n.deep))-avg(noDoze.map(n=>n.deep))}:null,
    sleepBal:avg(ready.map(r=>r.sleepBal)),readyAvg:avg(ready.map(r=>r.score)),readyLast:ready[ready.length-1]||null,
    tempAbs:ready.length?avg(ready.map(r=>Math.abs(r.temp||0))):null,steps:avg(act.map(a=>a.steps)),
    spo2Avg:avg(spo2.map(s=>s.pct)),bdiAvg:avg(spo2.map(s=>s.bdi)),
    best:N.reduce((a,b)=>b.score!=null&&(a.score==null||b.score>a.score)?b:a,N[0]),
    debt,MSF,MSW,MSFsc,midAll,chrono,sjl,nFree:free.length,nWork:work.length,sri,streak,inWin,
    onsetMean:avg(N.map(onsetMin)),
    week:{n:N.slice(-7).length,total:avg(N.slice(-7).map(n=>n.total)),score:avg(N.slice(-7).map(n=>n.score)),
      se:avg(N.slice(-7).map(n=>n.total))/avg(N.slice(-7).map(n=>(new Date(n.end)-new Date(n.start))/6e4))*100,
      lat:(v=>v==null?null:v/60)(avg(N.slice(-7).map(n=>n.lat))),dozes:D30.filter(z=>z.date>=N.slice(-7)[0].date).length},
  };
  m.share={deep:m.avgDeep/m.avgTotal,rem:m.avgRem/m.avgTotal};
  m.factors=factorList(m);
  m.exp=experiments(m);
  return m;
}

function calcSRI(rows,N){
  // Fenster pro Nacht: 12:00 am Vortag bis 12:00 am Tag der Nacht (1440 Minuten)
  const have=new Set(N.map(n=>n.date));
  const win=date=>{
    const a=new Uint8Array(1440), t0=Date.parse(addDays(date,-1)+"T12:00:00Z")+NOW_OFF*6e4;
    rows.forEach(r=>{
      const s=Math.floor((new Date(r.start).getTime()-t0)/6e4), e=Math.floor((new Date(r.end).getTime()-t0)/6e4);
      if(e<0||s>=1440||r.total<5) return;
      // Wachzeiten innerhalb der Nacht sind nicht minutengenau bekannt: die Effizienz verteilt sie gleichmäßig
      for(let i=Math.max(0,s);i<Math.min(1440,e);i++) a[i]=1;
    });
    return a;
  };
  let same=0,tot=0;
  N.forEach(n=>{
    const nx=addDays(n.date,1); if(!have.has(nx)) return;
    const A=win(n.date),B=win(nx);
    for(let i=0;i<1440;i++){tot++;if(A[i]===B[i])same++}
  });
  if(tot<1440*5) return null;
  return Math.round(200*same/tot-100);
}

/* ===== Abendplan ===== */
const TIB_MIN=400;
function planTimes(wakeMean){
  // Zeit im Bett = Schlafbedarf + 40 Minuten für Einschlafen und kurzes Aufwachen, dazu die Anpassung des Coachs.
  // Nie unter 6 h 40 im Bett (Untergrenze wie in der Schlafrestriktion üblich).
  // bed zählt in Minuten ab Mitternacht des Vortags: 23:00 = 1380, 01:30 = 1530.
  const wm=wakeMean??(M?M.wakeMean:480), tgt=store.get("nw_wake",null);
  let wake=tgt==null?Math.round(wm/15)*15:tgt;
  const sh=shiftPlan();
  if(sh&&sh.active) wake=sh.today;
  const tib=Math.max(TIB_MIN,CFG.need+40+CFG.win), b=((wake-tib)%1440+1440)%1440;
  // Nacht der Zeitumstellung im Herbst: Licht aus bleibt in Sommerzeit, der Wecker steht schon in Winterzeit.
  // Gilt, wenn der Plan der Körperzeit folgt (kein eigenes Ziel) oder dein Ziel mitrücken soll.
  const follow=(tgt==null&&!(sh&&sh.active))||store.get("nw_dst",null)!=null;
  const dOff=follow?Math.min(0,NOW_OFF-new Date(nightKeyEvening()+"T12:00:00").getTimezoneOffset()):0;
  return {wake:((wake+dOff)%1440+1440)%1440,wake0:wake,bed:b<720?b+1440:b,tib,shift:sh,dOff};
}
function shiftPlan(){
  // Sanft verschieben: alle 3 Tage 15 Minuten in Richtung Ziel
  const s=store.get("nw_shift",null); if(!s) return null;
  const days=Math.floor((new Date(localKey()+"T12:00:00")-new Date(s.start+"T12:00:00"))/864e5);
  const dir=Math.sign(s.to-s.from), steps=Math.ceil(Math.abs(s.to-s.from)/15);
  const done=Math.min(steps,Math.floor(days/3)+1);
  const today=done>=steps?s.to:s.from+dir*15*done;
  return {...s,steps,done,today,active:true,finished:done>=steps};
}

function greet(){const h=new Date().getHours();return h<5?"Gute Nacht":h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Gute Nacht"}
function levelInfo(s){
  const lv=[{n:"Basis",min:0},{n:"Solide",min:70},{n:"Gut",min:80},{n:"Sehr gut",min:85},{n:"Ausgezeichnet",min:90}];
  const i=lv.findLastIndex(l=>s>=l.min);const cur=lv[i],next=lv[i+1]||cur;
  return {cur,next,pct:next===cur?100:Math.round((s-cur.min)/(next.min-cur.min)*100)};
}
function headline(m){
  const bad=new Set(m.factors.filter(f=>f.status==="bad").map(f=>f.id));
  const parts=[];
  if(bad.has("dauer")||bad.has("debt")||bad.has("balance")) parts.push("Zeit");
  if(bad.has("rhythmus")||bad.has("sri")||bad.has("sjl")) parts.push("Rhythmus");
  if(bad.has("wach")||bad.has("doze")) parts.push("Ruhe");
  const rec=m.factors.filter(f=>["hrv","puls","tief"].includes(f.id)&&f.status==="good").length>=2;
  if(!parts.length) return rec?"Starke Basis. Jetzt geht es um den <em>Feinschliff</em>.":"Solide Nächte. Wir holen <em>mehr</em> heraus.";
  const list=parts.length===1?parts[0]:parts.slice(0,-1).join(", ")+" und "+parts[parts.length-1];
  return `${rec?"Dein Körper erholt sich gut.":"Da geht mehr."} Deinem Schlaf ${parts.length>1?"fehlen":"fehlt"} <em>${list}</em>.`;
}

function autoTags(key){
  // Vorbelegt: Routine gestartet (aus der App) und abends eingedöst (aus Oura)
  const t=[];
  if(store.get("nw_started",null)===key) t.push("routine");
  if(M&&M.dozes.some(z=>z.date===key)) t.push("dose");
  return t;
}

  // Wochen-Trend zuerst lesen, nicht die einzelne Nacht
  const N=M.N,w=N.slice(-7),p=N.slice(-14,-7);if(w.length<4) return "";
  const a=avg(w.map(n=>n.total)),b=p.length>=4?avg(p.map(n=>n.total)):null,d=b==null?0:a-b;
  const arrow=b==null||Math.abs(d)<10?"":d>0?ic("trending-up"):ic("trending-down");
  return `<p class="tiny fu" style="animation-delay:.28s;display:flex;align-items:center;gap:6px;margin-top:12px">${arrow}<span>Letzte 7 Nächte: Ø ${hm(a)} Schlaf, Ø Wert ${Math.round(avg(w.map(n=>n.score)))}${b!=null&&Math.abs(d)>=10?`, ${d>0?"+":"−"}${Math.round(Math.abs(d))} min gegenüber der Woche davor`:""}. Der Trend zählt mehr als eine Nacht.</span></p>`;
}
function coachState(){
  // Wochen-Coach nach KVT-I: das Schlaffenster folgt der Schlafeffizienz der letzten 7 Nächte
  const w=M.week;if(w.n<5) return null;
  const last=store.get("nw_coach",null), next=last?addDays(last,7):null, wait=next&&localKey()<next;
  const se=w.se, pressure=(w.lat!=null&&w.lat<10)||w.dozes>0, lack=M.avgTotal<CFG.need-15;
  let kind,t,b;
  // Umgekehrte Schlafrestriktion: bei guter Effizienz und Zeichen von Schlafmangel das Fenster verlängern
  if(se>=85&&(pressure||lack)){kind="plus";t="Schlaffenster 15 Minuten länger";b=`Deine Schlafeffizienz lag bei ${Math.round(se)} %. Du nutzt die Zeit im Bett also gut${pressure?`, und dein Körper zeigt Schlafdruck (${w.lat!=null&&w.lat<10?`Einschlafen in ${Math.round(w.lat)} Minuten`:`${w.dozes}× abends eingedöst`})`:""}. Zeit für mehr Schlaf: Licht aus 15 Minuten früher, Aufstehzeit bleibt. Anfangs kann das Einschlafen etwas länger dauern. Bis 20 Minuten ist das in Ordnung.`}
  else if(se>=85){kind="hold";t="Dein Schlaffenster passt";b=`Schlafeffizienz ${Math.floor(se)} %, kein Zeichen von Schlafmangel. Halte die Zeiten. Fokus diese Woche: feste Aufstehzeit, auch am Wochenende.`}
  else {kind="minus";t="Erst die Wachzeit senken";b=`Schlafeffizienz ${Math.floor(se)} %. Du liegst viel wach. Mehr Zeit im Bett würde das verstärken. Geh erst ins Bett, wenn du schläfrig bist. Steh nach dem Aufwachen gleich auf.${planTimes().tib-15>=TIB_MIN?" Hilft das nach einer Woche nicht, kürze dein Schlaffenster um 15 Minuten.":""}`}
  // Kürzen erst, wenn die Wachzeit auch nach einer Woche mit den Regeln hoch bleibt
  const since=store.get("nw_coach_minus",null);
  if(kind==="minus"&&!since) store.set("nw_coach_minus",localKey());
  if(kind!=="minus"&&since) store.del("nw_coach_minus");
  const cut=kind==="minus"&&since&&localKey()>=addDays(since,7)&&planTimes().tib-15>=TIB_MIN;
  return {kind,t,b,se,wait,next,cut};
}

}
function dstChange(){
  // Nächste Zeitumstellung in den kommenden 21 Tagen (Mittag zu Mittag verglichen)
  const off=k=>new Date(k+"T12:00:00").getTimezoneOffset();let k=localKey();
  for(let i=0;i<21;i++){const n=addDays(k,1);if(off(n)!==off(k))return {date:n,delta:off(k)-off(n)};k=n}
  return null;
}

function applyDst(){
  // Geplante Zeitumstellung: Eigene Ziele rücken einmalig mit, damit die Körperzeit gleich bleibt.
  // Ohne eigenes Ziel folgt der Plan ohnehin den Nächten, die in Körperzeit gelesen werden.
  const d=store.get("nw_dst",null);if(!d||localKey()<d) return;
  if(new Date().getTimezoneOffset()===new Date(addDays(d,-1)+"T12:00:00").getTimezoneOffset()) return; // Uhr noch nicht umgestellt
  const delta=store.get("nw_dst_delta",-60), w=store.get("nw_wake",null), sh=store.get("nw_shift",null);
  if(w!=null) store.set("nw_wake",((w+delta)%1440+1440)%1440);
  if(sh) store.set("nw_shift",{...sh,from:((sh.from+delta)%1440+1440)%1440,to:((sh.to+delta)%1440+1440)%1440});
  store.del("nw_dst");store.del("nw_dst_delta");
  M=build(DATA);if(w!=null||sh)toast("Zeitumstellung: dein Plan ist mitgerückt");
}

  const toBed=bed-nowB, steps=planSteps(), next=steps.find(s=>s.t>nowB)||steps.find(s=>s.t+1440>nowB);

/* --- Rhythmus --- */
function chronoLabel(mid){
  const h=((mid%1440)+1440)%1440/60;
  // Faustregel, keine offizielle Einteilung: das MCTQ vergleicht eigentlich mit anderen Menschen
  if(h<2.5) return ["eine Lerche","ein früher Typ"];
  if(h<3.5) return ["eher eine Lerche","ein eher früher Typ"];
  if(h<4.5) return ["ein Normaltyp","ein mittlerer Typ"];
  if(h<5.5) return ["eher eine Eule","ein eher später Typ"];
  if(h<6.5) return ["eine Eule","ein später Typ"];
  return ["eine ausgeprägte Eule","ein sehr später Typ"];
}
function energyModel(){
  // Zwei-Prozess-Modell (Borbély): Schlafdruck S steigt im Wachsein (τ 18,2 h) und fällt im Schlaf (τ 4,2 h).
  // Die innere Uhr C ist eine Welle, deren Wach-Signal etwa 3 Stunden vor der gewohnten Einschlafzeit am stärksten ist,
  // dazu eine 12-Stunden-Welle für das Tief etwa 8 Stunden nach dem Aufwachen.
  const onset=M.onsetMean, wakeH=M.wakeMean;  // Minuten (onset ab Mitternacht Vortag, wake ab Mitternacht)
  const sleepLen=((wakeH+1440)-onset);         // Minuten Schlafphase
  const step=10, out=[];
  let S=0.3;
  // zwei Tage einschwingen, dann einen Tag ab Aufwachen aufzeichnen
  const day=1440;
  const asleep=t=>{const x=((t-onset)%day+day)%day;return x<sleepLen};
  const start=onset+sleepLen; // Aufwachen (Minuten ab Mitternacht Vortag)
  const C=t=>0.5*Math.cos(2*Math.PI*(t-(onset-180))/day)+0.2*Math.cos(4*Math.PI*(t-(start+120))/day);
  for(let t=start-3*day;t<start+day;t+=step){
    if(asleep(t)) S=S*Math.exp(-step/60/4.2); else S=1-(1-S)*Math.exp(-step/60/18.2);
    if(t>=start){
      const since=t-start, inertia=since<120?-0.55*Math.exp(-since/40):0;
      out.push({t,S,C:C(t),e:C(t)-1.1*S+inertia,asleep:asleep(t)});
    }
  }
  const awake=out.filter(p=>!p.asleep);
  const lo=Math.min(...awake.map(p=>p.e)),hi=Math.max(...awake.map(p=>p.e));
  out.forEach(p=>p.n=(p.e-lo)/(hi-lo||1));
  return {pts:out,start,onset,sleepLen};
}
function chartEnergy(){
  const {pts,start,onset}=energyModel(),W=320,H=150,pl=8,pr=8,pt=18,pb=22;
  const end=start+1440, x=t=>pl+(t-start)/(end-start)*(W-pl-pr), y=v=>pt+(1-v)*(H-pt-pb);
  const aw=pts.filter(p=>!p.asleep);
  let d="";aw.forEach((p,i)=>d+=(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.n).toFixed(1));
  const lastAw=aw[aw.length-1];

  // Schlaf-Band
  s+=`<rect x="${x(lastAw.t)}" y="${pt}" width="${W-pr-x(lastAw.t)}" height="${H-pt-pb}" fill="rgba(140,36,64,.25)" rx="6"/><text x="${(x(lastAw.t)+W-pr)/2}" y="${pt+12}" text-anchor="middle" style="fill:rgba(240,179,194,.8)">Schlaf</text>`;
  // Wach-Zone vor dem Schlaf
  const wz0=onset+1440-180,wz1=onset+1440-60;
  s+=`<rect x="${x(wz0)}" y="${pt}" width="${x(wz1)-x(wz0)}" height="${H-pt-pb}" fill="rgba(230,200,115,.08)"/>`;
  s+=`<path d="${d} L${x(lastAw.t)} ${H-pb} L${x(aw[0].t)} ${H-pb} Z" fill="url(#eg)"/><path d="${d}" fill="none" stroke="#f0b3c2" stroke-width="1.8" stroke-linejoin="round"/>`;
  // Jetzt
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();let tn=nm;while(tn<start)tn+=1440;while(tn>=end)tn-=1440;

  return s+"</svg>";

function energyMoments(){
  const {pts,start,onset}=energyModel();const aw=pts.filter(p=>!p.asleep);

  const awakeH=(onset+1440-start)/60, napBy=(onset<start?onset+1440:onset)-480; // Nickerchen spätestens 8 h vor dem Schlaftor
  const peak1=find(1.5,6,(a,b)=>a>b), dip=find(4,10,(a,b)=>a<b), peak2=find(9,Math.max(9.5,awakeH-0.5),(a,b)=>a>b);
  return [
    {i:"sunrise",t:`${clock(start)} – ${clock(start+90)}`,b:"Schlafträgheit",s:"Der Kopf braucht etwas Zeit. Licht und Bewegung helfen, kein Grund zum Liegenbleiben."},
    peak1&&{i:"zap",t:clock(peak1.t),b:"Erstes Hoch",s:"Gute Zeit für schwere Denkarbeit, Lernen und wichtige Gespräche."},
    dip&&{i:"battery-low",t:clock(dip.t),b:"Tagestief",s:`Natürliches Tief. Kurz raus, Licht, Bewegung.${dip.t<napBy?` Brauchst du ein Nickerchen: höchstens 20 Minuten und vor ${clock(napBy)}, sonst fehlt am Abend der Schlafdruck.`:""}`},
    peak2&&{i:"flame",t:clock(peak2.t),b:"Zweites Hoch",s:"Die innere Uhr hält dich jetzt aktiv wach. Darum fühlst du dich abends oft fit. Lass dich davon nicht täuschen. Bleib bei deiner Zeit für Licht aus."},
    {i:"moon",t:clock(onset),b:"Dein Schlaftor",s:"Hier fällt das Wach-Signal ab und der Schlafdruck ist hoch. In dieser Zeit schläfst du am leichtesten ein."},
  ].filter(Boolean);
}

  [60,70,85].forEach(v=>s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v===85?.35:.08})" ${v===85?'stroke-dasharray="3 3"':""}/><text x="0" y="${y(v)+3}">${v}</text>`);
  N.forEach((n,i)=>{const sc=clamp(n.score||50,50,100);const x=pl+i*bw+bw*.18,h=y(50)-y(sc);const c=sc>=80?"#f0b3c2":sc>=70?"#b8506c":"#6e2238";
    s+=`<rect x="${x}" y="${y(sc)}" width="${bw*.64}" height="${h}" rx="2" fill="${c}"><title>${fmtDate(n.date)}: ${n.score}</title></rect>`});

  s+=`<text x="${W}" y="${y(85)-4}" text-anchor="end" style="fill:#f0b3c2">Ziel 85</text></svg>`;return s;
}

  {i:"orbit",t:"Zwei Kräfte steuern deinen Schlaf",b:"<p>Der <b>Schlafdruck</b> (Adenosin) baut sich auf, solange du wach bist, und wird im Schlaf abgebaut. Die <b>innere Uhr</b> sendet tagsüber ein Wach-Signal, das am Abend am stärksten ist und dann abfällt.</p><p>Du schläfst am besten ein, wenn der Druck hoch ist und das Signal fällt. Darum schadet Eindösen am Abend: Es baut Druck ab, der dir später beim Einschlafen und für den Tiefschlaf fehlt.</p>",src:"Borbély 1982; Daan, Beersma & Borbély 1984"},
  {i:"bed",t:"Die wirksamste Methode: KVT-I",b:"<p>Die kognitive Verhaltenstherapie bei Insomnie (KVT-I) ist laut deutscher S3-Leitlinie 2025 und US-Leitlinie die erste Wahl, vor Tabletten. Schlafhygiene allein hilft bei Insomnie kaum.</p><p>Wichtige Regeln: 1. Nur ins Bett, wenn du schläfrig bist. 2. Das Bett nur für Schlaf und Sex. 3. Nach etwa 20 Minuten wach: aufstehen, bei schwachem Licht etwas Ruhiges tun, zurück, wenn du schläfrig bist. 4. Jeden Tag zur gleichen Zeit aufstehen. 5. Nicht länger im Bett liegen, als du schläfst.</p><p>Der Wochen-Coach auf „Heute“ passt dein Schlaffenster jede Woche an deine Schlafeffizienz an. Das Schlaffenster ist die Zeit von Licht aus bis Aufstehen.</p>",src:"S3-Leitlinie Insomnie 2025 (AWMF 063-003); Edinger et al. 2021 (AASM)"},
  {i:"sunrise",t:"Licht ist der Taktgeber",b:"<p>Helles Licht am Morgen stellt die Uhr früher, helles Licht am Abend stellt sie später. Draußen sind es selbst bei Wolken meist über 1.000 Lux, drinnen oft nur 100 bis 500.</p><p>Darum: in der ersten Stunde nach dem Aufstehen 15 bis 30 Minuten raus. Ab 3 Stunden vor dem Schlafengehen nur noch schwaches, warmes Licht, etwa wie eine kleine Tischlampe. Im Schlafzimmer so dunkel wie möglich.</p>",src:"Brown et al. 2022, PLoS Biology"},
  {i:"calendar-clock",t:"Regelmäßigkeit ist ein eigener Faktor",b:"<p>Feste Zeiten stabilisieren die innere Uhr. In der UK-Biobank-Studie mit über 60.000 Menschen hing regelmäßiger Schlaf stärker mit einem geringeren Sterberisiko zusammen als die Schlafdauer.</p><p>Der wichtigste Anker ist die <b>Aufstehzeit</b>, an allen 7 Tagen, höchstens ±15 Minuten.</p>",src:"Windred et al. 2024, SLEEP; Phillips et al. 2017"},
  {i:"sun-moon",t:"Eule? Du kannst deine Uhr verschieben",b:"<p>In einer kleinen Studie mit 22 Menschen stellten späte Typen ihre Uhr in 3 Wochen um etwa 2 Stunden früher, ohne weniger zu schlafen. Das Rezept: feste Zeiten an allen Tagen, viel Licht am Morgen, wenig Licht am Abend, früh frühstücken, Abendessen nicht zu spät.</p><p>Sanft geht es mit 15 Minuten alle 3 Tage. Immer zuerst die Aufstehzeit verschieben. Das macht der Bereich „Rhythmus“ für dich.</p>",src:"Facer-Childs et al. 2019, Sleep Medicine"},
  {i:"coffee",t:"Koffein wirkt länger, als du denkst",b:"<p>Die Hälfte des Koffeins ist nach etwa 4 Stunden abgebaut, bei manchen erst nach 8. Eine Auswertung von 24 Studien rät bei einer normalen Tasse Kaffee (etwa 100 mg) zu knapp 9 Stunden Abstand zum Schlafen. Stärkere Getränke brauchen länger.</p><p>In einem Versuch kostete eine hohe Dosis Koffein (400 mg, etwa 4 Tassen Kaffee) 6 Stunden vor dem Schlafen über eine Stunde Schlaf. Die Leute merkten es nicht.</p>",src:"Gardiner et al. 2023; Drake et al. 2013"},
  {i:"wine",t:"Alkohol stiehlt die zweite Nachthälfte",b:"<p>Alkohol macht müde, aber er unterdrückt REM-Schlaf, erhöht den Puls in der Nacht und senkt die HRV. In einer großen Studie mit über 4.000 Menschen veränderten schon kleine Mengen, etwa ein Bier, Puls und HRV in den ersten drei Schlafstunden. Ab etwa zwei Gläsern sinkt der REM-Schlaf deutlich.</p><p>Am besten keinen Alkohol, sonst mindestens 4 Stunden vor dem Schlafen aufhören.</p>",src:"Gardiner et al. 2025; Pietilä et al. 2018"},
  {i:"thermometer",t:"Kühl schläft es sich besser",b:"<p>Zum Einschlafen sinkt die Körpertemperatur. Für das Schlafzimmer gelten 16 bis 19 °C als guter Richtwert. Es klingt paradox, ist aber gut belegt: Eine warme Dusche oder ein Bad mit 40 bis 42 °C, 1 bis 2 Stunden vor dem Schlafengehen, lässt dich schneller einschlafen, weil der Körper danach Wärme abgibt.</p>",src:"Haghayegh et al. 2019, Metaanalyse"},
  {i:"notebook-pen",t:"Gedanken aus dem Kopf aufs Papier",b:"<p>In einer Studie mit 57 jungen Erwachsenen schliefen alle, die vor dem Schlafen 5 Minuten eine konkrete To-do-Liste für morgen schrieben, im Schlaflabor etwa 9 Minuten schneller ein als Menschen, die über Erledigtes schrieben. Je konkreter die Liste, desto besser.</p><p>Bei Sorgen kann eine feste Grübelzeit am frühen Abend helfen: Sorge in eine Spalte, den nächsten kleinen Schritt in die andere. Kommt sie im Bett wieder: „Steht schon im Buch.“</p>",src:"Scullin et al. 2018; Carney & Waters 2006"},
  {i:"wind",t:"Langsam atmen beruhigt",b:"<p>Langsames Atmen mit etwa 6 Atemzügen pro Minute (4 Sekunden ein, 6 aus) beruhigt das Nervensystem. In einer kleinen Schlaflabor-Studie schliefen Menschen mit Schlafproblemen nach 20 Minuten davon schneller ein.</p><p>Zyklisches Seufzen hob in einer Studie die Stimmung stärker als Achtsamkeit. Auf den Schlaf wurde das Seufzen nicht untersucht. Die 4-7-8-Atmung ist beliebt, aber kaum untersucht.</p>",src:"Tsai et al. 2015; Balban et al. 2023"},
  {i:"gauge",t:"Werte sind Hinweise, keine Noten",b:"<p>Der Ring erkennt Schlaf sehr gut, Wachphasen schlechter. Bei den Phasen leicht, tief und REM stimmt er in Studien zu etwa 80 % mit dem Schlaflabor überein. Einzelne Nächte schwanken also. Wochen-Trends sind verlässlicher.</p><p>Wer sich zu sehr auf die Zahl fixiert, kann dadurch schlechter schlafen. Fachleute nennen das Orthosomnie. Achte auf die Richtung, nicht auf den Einzelwert.</p>",src:"Altini & Kinnunen 2021; Robbins et al. 2024; Baron et al. 2017"},
  {i:"triangle-alert",t:"Wann du ärztlichen Rat brauchst",b:"<p>Lass dich untersuchen, wenn du an mindestens 3 Nächten pro Woche über 3 Monate schlecht schläfst und tagsüber darunter leidest. Ebenso bei lautem Schnarchen mit Atemaussetzern, bei starker Tagesmüdigkeit trotz genug Schlaf oder bei unruhigen Beinen am Abend. Auch, wenn du länger als 4 Wochen Schlaftabletten nimmst.</p><p><b>Sofort:</b> Wirst du am Steuer müde oder nickst fast ein, halte an und lass das ärztlich abklären. Hast du Gedanken, dir etwas anzutun, ruf sofort die 112 oder die Telefonseelsorge an: 0800 111 0 111.</p><p>Erste Anlaufstelle ist die Hausarztpraxis. Für Ein- und Durchschlafstörungen (Insomnie) gibt es KVT-I als App auf Rezept (DiGA, zum Beispiel somnio, HelloBetter Schlafen oder somnovia), für gesetzlich Versicherte kostenlos.</p>",src:"DGSM; S3-Leitlinie Insomnie 2025; DiGA-Verzeichnis"},
];
function screenFaktoren(){
  const groups={alle:"Alle",schlaf:"Schlaf",rhythmus:"Rhythmus",koerper:"Körper",tag:"Tag"};
  const F=M.factors.filter(f=>factorFilter==="alle"||f.group===factorFilter);
  const order={bad:0,ok:1,good:2,info:3};F.sort((a,b)=>order[a.status]-order[b.status]||b.w-a.w);
  const label={good:"Stark",ok:"Okay",bad:"Baustelle",info:"Info"};
  const cnt=s=>M.factors.filter(f=>f.status===s).length;
  const E=M.exp;
  return `${appbar()}
  <p class="eyebrow fu" style="animation-delay:.1s">Was in deinen Schlaf hineinspielt</p>
  <h1 class="title fu" style="animation-delay:.15s">${cnt("good")} stark, ${cnt("ok")} okay, ${cnt("bad")} ${cnt("bad")===1?"Baustelle":"Baustellen"}</h1>
  <p class="lead fu" style="animation-delay:.2s">Jeder Faktor stammt aus deinen Oura-Daten. Oben steht, was dir am meisten bringt.</p>
  <div class="filters fu" style="margin-top:16px;animation-delay:.25s">${Object.entries(groups).map(([k,v])=>`<button class="${factorFilter===k?"liquid-glass-selected":"liquid-glass"}" data-filter="${k}">${v}</button>`).join("")}</div>
  <div class="factors">${F.map((f,i)=>`<div class="factor liquid-glass fu" style="animation-delay:${.3+i*.04}s">
    <div class="top"><div class="name">${ic(f.icon)}${f.name}</div><span class="chip ${f.status}">${label[f.status]}</span></div>
    <div class="val num">${f.val}<small>${f.unit}</small></div>
    <div class="why">${f.why}</div><div class="do">→ ${f.do}</div></div>`).join("")}</div>
  <h2 class="sec">Deine Experimente <small>aus dem Morgen-Check-in</small></h2>
  ${E.res.length?`<div class="stack">${E.res.sort((a,b)=>Math.abs(b.ds)-Math.abs(a.ds)).map(r=>`<div class="factor liquid-glass">
      <div class="top"><div class="name">${ic(r.tg.i)}${r.tg.t}</div><span class="chip ${r.sure?(r.ds<=-2?"bad":r.ds>=2?"good":"info"):"info"}">${r.sure?"Hinweis":"erste Tendenz"}</span></div>
      <div class="val num">${r.ds>=0?"+":""}${r.ds.toFixed(1)}<small>Punkte Schlafwert</small></div>
      <div class="why">Schlaf ${r.dt>=0?"+":"−"}${Math.abs(Math.round(r.dt))} min · Tiefschlaf ${r.dd>=0?"+":"−"}${Math.abs(Math.round(r.dd))} min${isNaN(r.dh)?"":` · HRV ${r.dh>=0?"+":""}${Math.round(r.dh)} ms`}. ${r.ny} Nächte mit, ${r.nn} ohne.</div></div>`).join("")}</div>
    <p class="tiny">Vergleich deiner Nächte mit und ohne Merkmal. Ab je 5 Nächten ein Hinweis, kein Beweis. Ein Schlafwert schwankt von Nacht zu Nacht um einige Punkte. Kleine Unterschiede sind darum oft Zufall.</p>`
  :`<div class="card liquid-glass"><p class="note" style="margin:0">Mach morgens den Check-in auf „Heute“. Nach je 3 Nächten mit und ohne ein Merkmal siehst du hier, was <b style="font-weight:500;color:#fff">dir</b> wirklich hilft oder schadet. Bisher: ${E.count} Check-ins.</p></div>`}
  <h2 class="sec">Wissen aus der Schlafforschung</h2>
  <div class="stack">${KNOW.map(k=>`<details class="know liquid-glass"><summary>${ic(k.i)}${k.t}${ic("chevron-down","chev")}</summary><div class="kb">${k.b}<div class="src">Quelle: ${k.src}</div></div></details>`).join("")}</div>`;
}

function screenAbend(){
  const {wake,bed,shift}=planTimes();
  const goals=store.get("nw_goals",null)||defaultGoals();
  const nk=nightKeyEvening();
  const done=store.get("nw_done_"+nk,[]);
  const started=store.get("nw_started",null)===nk;
  const S=planSteps(), now=new Date(), nm=now.getHours()*60+now.getMinutes(), nowB=nm<720?nm+1440:nm;
  const nextId=(S.find(s=>s.t>nowB-30&&!done.includes(s.id))||{}).id; // gerade fälliger oder nächster offener Schritt
  return `${appbar()}
  <p class="eyebrow fu" style="animation-delay:.1s">Wähle, woran du arbeiten willst</p>
  <h1 class="title fu" style="animation-delay:.15s;font-size:28px">Was soll dein Schlaf als Nächstes können?</h1>
  <div class="goals" style="margin-top:22px">${GOALS.map((g,i)=>`<button class="goal ${goals.includes(g.id)?"liquid-glass-selected":"liquid-glass"} fu" style="animation-delay:${.25+i*.08}s" data-goal="${g.id}" aria-pressed="${goals.includes(g.id)}"><span class="n">0${i+1}</span><span class="t">${g.t}</span></button>`).join("")}</div>
  <p class="note fu" style="animation-delay:.55s">Vorausgewählt sind deine größten Baustellen laut Oura. Der Plan passt sich an.</p>

  <h2 class="sec fu" style="animation-delay:.6s">Dein Abend <small>${shift&&!shift.finished?"Schritt "+shift.done+" von "+shift.steps:""}</small></h2>
  <div class="card liquid-glass tune fu" style="animation-delay:.62s">
    <div><div class="stat"><div class="k">Aufstehen um</div></div><div class="tiny" style="margin-top:4px">Licht aus dann um <b class="num" style="color:var(--rose);font-weight:500">${clock(bed)}</b></div></div>
    <div class="ctrl"><button class="liquid-glass" data-wake="-15" aria-label="15 Minuten früher">${ic("minus")}</button><b class="num">${clock(wake)}</b><button class="liquid-glass" data-wake="15" aria-label="15 Minuten später">${ic("plus")}</button></div>
  </div>
  <div class="timeline fu" style="animation-delay:.7s">${S.map(s=>`<button class="tl ${done.includes(s.id)?"done":""} ${s.id===nextId?"now":""}" data-step="${s.id}" aria-pressed="${done.includes(s.id)}"><span class="time num">${clock(s.t)}</span><span class="rail"><i></i></span><span class="body"><b>${ic(s.i)}${s.b}</b><span>${s.s}</span></span></button>`).join("")}</div>

  <div class="voice fu" style="animation-delay:.8s"><div class="glow"><button class="liquid-glass" data-tool="resonanz" aria-label="Ruhe-Atmung starten">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="5" y1="10" x2="5" y2="16"/><line x1="9" y1="6" x2="9" y2="20"/><line x1="13" y1="3" x2="13" y2="23"/><line x1="17" y1="7" x2="17" y2="19"/><line x1="21" y1="11" x2="21" y2="15"/></svg></button></div>
    <div class="lab">Ruhe-Atmung zum Einschlafen</div></div>

  <div class="slider liquid-glass fu ${started?"done":""}" id="slider" style="animation-delay:.85s">
    <div class="thumb" id="thumb" role="button" aria-label="${started?"Abendroutine läuft":"Abendroutine starten"}" tabindex="0">${ic(started?"check":"arrow-right")}</div>
    <div class="label">${started?"Abendmodus an. Schlaf gut.":"Abendroutine starten"}</div>
    <div class="chev">${started?"":`<span style="color:rgba(255,255,255,.4)">${ic("chevron-right")}</span><span style="color:rgba(255,255,255,.5)">${ic("chevron-right")}</span><span style="color:rgba(255,255,255,.6)">${ic("chevron-right")}</span>`}</div>
  </div>
  <p class="tiny" style="text-align:center">${done.length} von ${S.length} Schritten erledigt. Tippe einen Schritt an, um ihn abzuhaken. Starten schaltet den warmen Nachtfilter ein.</p>
  ${IN_CLAUDE?"":`<div class="card liquid-glass lever" style="margin-top:14px"><div class="icw">${ic("alarm-clock")}</div><div><h3>Erinnerungen im Kalender</h3><p>Eine Web-App kann von allein keine Wecker stellen. Dein Kalender schon: täglich Letzter Kaffee, Licht dimmen, Gedanken parken und Licht aus${M&&M.dozes.length>=3?", dazu ein Sofa-Wächter":""}.</p><div class="btnrow" style="margin-top:10px"><button class="pillbtn liquid-glass" data-act="ics">Kalender-Datei laden</button></div><p class="tiny">Nach einer Änderung deiner Zeiten die Datei neu laden und die alten Termine löschen.</p></div></div>`}

  <h2 class="sec">Werkzeuge für die Nacht</h2>
  <div class="tools">${TOOLS.map(t=>`<button class="tool liquid-glass" data-tool="${t.id}">${ic(t.i)}<b>${t.b}</b><span>${t.s}</span></button>`).join("")}
    <button class="tool liquid-glass wide" data-tool="wach">${ic("cloud-moon")}<div><b>Nachts aufgewacht?</b><span>Dunkler Bildschirm, ruhige Schritte, keine Uhr.</span></div></button>
  </div>`;
}

let ovTimer=null, ovKind=null;
function openOv(kind){
  clearTimers();ovKind=kind;
  const ov=$("#ov");ov.className="ov";ov.innerHTML=OV[kind]();ov.classList.add("open");ov.setAttribute("aria-hidden","false");
  if(kind==="wach") ov.classList.add("wake-ov");
  const f=ov.querySelector("[data-autofocus]");if(f)setTimeout(()=>f.focus(),300);
  if(OVINIT[kind]) OVINIT[kind]();
}
function closeOv(){clearTimers();ovKind=null;const ov=$("#ov");ov.classList.remove("open");ov.setAttribute("aria-hidden","true");setTimeout(()=>{if(!ovKind)ov.innerHTML=""},400)}
function clearTimers(){clearTimeout(ovTimer);clearInterval(ovTimer);releaseWake()}
let wakeLock=null;
async function holdWake(){try{wakeLock=await navigator.wakeLock?.request("screen")}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}

    const [t,s,sc]=B.seq[step];ph.textContent=t;ct.textContent=`Runde ${round+1} von ${B.rounds}`;orb.style.transitionDuration=s+"s";orb.style.transform=`scale(${sc})`;
    ovTimer=setTimeout(()=>{step++;if(step>=B.seq.length){step=0;round++}run()},s*1000)};

}

/* ===== Kalender-Datei mit täglichen Erinnerungen ===== */
function makeICS(){
  const {bed}=planTimes(), S=planSteps(), pick=["koffein","licht","sofa","parken","aus"];
  const now=new Date(), stamp=now.toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const nm=now.getHours()*60+now.getMinutes(), nowB=nm<720?nm+1440:nm;
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Nachtwerk//Schlaf//DE","CALSCALE:GREGORIAN","X-WR-CALNAME:Nachtwerk"];
  S.filter(x=>pick.includes(x.id)).forEach(x=>{
    // Zeiten zählen ab Mitternacht des Vortags; der erste Termin ist der nächste, der noch kommt
    let day=nm<720?addDays(localKey(),-1):localKey();if(x.t<=nowB)day=addDays(day,1);
    const at=addDays(day,Math.floor(x.t/1440)),m=((x.t%1440)+1440)%1440;
    const dt=at.replace(/-/g,"")+"T"+pad(Math.floor(m/60))+pad(m%60)+"00";
    const txt=(x.id==="aus"?"Licht aus. ":"")+x.s;
    lines.push("BEGIN:VEVENT","UID:nachtwerk-"+x.id+"@nachtwerk","DTSTAMP:"+stamp,"DTSTART:"+dt,"DURATION:PT10M","RRULE:FREQ=DAILY",
      "SUMMARY:"+icsEsc((x.id==="sofa"?"Sofa-Wächter: ":"")+x.b),"DESCRIPTION:"+icsEsc(txt),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(x.b),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(foldICS).join("\r\n")+"\r\n";
}
const icsEsc=t=>String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function foldICS(l){const out=[];let cur="",len=0;for(const ch of l){const b=new TextEncoder().encode(ch).length;if(len+b>73){out.push(cur);cur=" ";len=1}cur+=ch;len+=b}out.push(cur);return out.join("\r\n")}

/* ===== Code zum Übertragen ===== */
const b64u={enc:u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
  dec:str=>{str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const s=atob(str),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}};
async function encodeData(D){
  // Name und Schlafbedarf reisen mit, damit die App auf dem Handy gleich passt
  const json=JSON.stringify({v:1,d:D,p:{name:CFG.name,need:CFG.need}});
  try{if(window.CompressionStream){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));const u=new Uint8Array(await new Response(cs).arrayBuffer());return "NW1."+b64u.enc(u)}}catch(e){}
  return "NW0."+b64u.enc(new TextEncoder().encode(json));
}
async function decodeData(code){
  code=String(code).trim().replace(/\s+/g,"");
  const m=code.match(/NW([01])\.([A-Za-z0-9_-]+)/);if(!m) throw new Error("Das sieht nicht wie ein Nachtwerk-Code aus.");
  let u=b64u.dec(m[2]);
  if(m[1]==="1"){const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"));u=new Uint8Array(await new Response(ds).arrayBuffer())}
  const o=JSON.parse(new TextDecoder().decode(u));
  if(!o||!o.d||!Array.isArray(o.d.sleep)) throw new Error("Der Code enthält keine Schlafdaten.");
  if(o.p){if(o.p.name&&!store.get("nw_name",null))store.set("nw_name",String(o.p.name).slice(0,30));if(o.p.need&&store.get("nw_need",null)==null)store.set("nw_need",clamp(Number(o.p.need)||450,360,600))}
  return o.d;
}
async function importCode(code,src="code"){
  const tm=String(code).trim().match(/NWT\.([A-Za-z0-9_-]+)/);
  if(tm){let t;try{t=JSON.parse(new TextDecoder().decode(b64u.dec(tm[1])))}catch(e){throw new Error("Der Anmelde-Code ist unvollständig. Kopier ihn noch einmal.")}
    if(!t||!t.v||(!t.r&&(!t.exp||t.exp<Date.now())))throw new Error("Der Anmelde-Code ist abgelaufen.");
    const px=t.px?normProxy(t.px):"",cid=t.cid?String(t.cid).replace(/\s+/g,"").slice(0,80):"";
    if(t.px&&!px)throw new Error("Die Brücken-Adresse im Code ist ungültig.");
    // Ein älterer Code würde die neuere Anmeldung ersetzen, und die nächste Erneuerung schlüge fehl
    const cur=OURA.token();if(cur&&cur.iat&&Number(t.iat)<cur.iat)throw new Error("Dieser Anmelde-Code ist älter als deine jetzige Anmeldung. Du bist schon verbunden.");
    if((px&&px!==OURA.proxy())||(cid&&cid!==OURA.clientId())){if(!confirm("Diese Oura-Verbindung übernehmen?\nBrücke: "+(px||OURA.proxy())+"\nClient ID: "+(cid||OURA.clientId())+"\n\nNur OK, wenn das deine eigene Brücke ist."))throw new Error("Brücken-Adresse nicht übernommen.");if(px)store.set("nw_oura_proxy",px)}
    store.set("nw_oura_tok",{v:String(t.v),r:t.r?String(t.r):null,exp:Number(t.exp)||0,scope:String(t.scope||""),iat:Number(t.iat)||0});if(cid)store.set("nw_oura_cid",cid);
    toast("Oura-Anmeldung übernommen");OURA.sync().catch(e=>{ouraError=e.message;toast(e.message);if(e.code==="auth")keepScroll(render)});return "token"}
  const d=await decodeData(code);
  DATA=mergeData(SOURCE.kind==="demo"?EMPTY:DATA,d);saveData(src);rebuild();
  toast(`${d.sleep.length} Schlafphasen übernommen`);
}

/* ===== Oura direkt (nur Web-App) =====
   Anmeldung mit Ouras Code-Verfahren (OAuth mit PKCE). Den Code tauscht deine eigene Brücke (Cloudflare
   Worker, siehe oura-proxy/) gegen Schlüssel, denn nur sie kennt das Client Secret. Die Schlüssel bleiben
   auf diesem Gerät und erneuern sich selbst. Auch die Daten laufen über die Brücke, weil Oura keine
   direkten Browser-Abrufe erlaubt (CORS). Ohne Brücke bleibt der Code aus Claude.
   Ouras älteres Verfahren ohne Secret liefert seit Herbst 2026 Schlüssel ohne Freigaben, darum nicht mehr. */
const GUIDE_URL="https://github.com/ferdawsyousuf-stack/psychologie-lern-app/blob/HEAD/nachtwerk/oura-proxy/ANLEITUNG.md";
const OURA_AUTH="https://moi.ouraring.com/oauth/v2/ext/oauth-authorize";
const OURA_SCOPE="extapi:daily extapi:spo2";
// Brücken-Adresse säubern: Leerzeichen weg, https:// ergänzen, nur der Rechnername zählt. null = ungültig
const normProxy=v=>{v=String(v||"").replace(/\s+/g,"");if(!v)return "";if(!/^[a-z]+:\/\//i.test(v))v="https://"+v;try{const u=new URL(v);return /^https?:$/i.test(u.protocol)&&/\.workers\.dev$/i.test(u.hostname)?"https://"+u.hostname.toLowerCase():null}catch(e){return null}};
const ouraErr=(msg,code)=>Object.assign(new Error(msg),{code});
const OURA={
  // Verbunden, solange ein Zugang da ist, der noch gilt oder sich erneuern lässt
  token:()=>{const t=store.get("nw_oura_tok",null);return t&&t.v&&(t.r||!t.exp||t.exp>Date.now())?t:null},
  clientId:()=>String(store.get("nw_oura_cid","")).replace(/\s+/g,""),
  proxy:()=>normProxy(store.get("nw_oura_proxy",""))||"",
  // Nur Zugänge ohne Erneuerungs-Schlüssel laufen ab
  daysLeft:()=>{const t=OURA.token();return t&&!t.r&&t.exp?Math.floor((t.exp-Date.now())/864e5):null},
  async authorize(){
    const cid=OURA.clientId(),px=OURA.proxy();
    if(!cid){toast("Bitte zuerst die Client ID eintragen");return}
    if(!px){toast("Bitte zuerst die Brücken-Adresse eintragen");return}
    const rnd=n=>{const r=new Uint8Array(n);crypto.getRandomValues(r);return b64u.enc(r)};
    const state=rnd(16),verifier=rnd(48);
    const challenge=b64u.enc(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier))));
    store.set("nw_oura_pkce",{state,verifier,t:Date.now()});
    const u=new URL(OURA_AUTH);
    // prompt=consent: Oura zeigt die Freigabe immer, damit keine alte, leere Freigabe wiederverwendet wird
    Object.entries({response_type:"code",client_id:cid,redirect_uri:PWA_URL,scope:OURA_SCOPE,state,code_challenge:challenge,code_challenge_method:"S256",prompt:"consent"}).forEach(([k,v])=>u.searchParams.set(k,v));
    location.href=u.toString();
  },
  async tokenCall(params){
    const px=OURA.proxy();if(!px) throw ouraErr("Bitte die Brücken-Adresse eintragen.","auth");
    let r;try{r=await fetch(px+"/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({...params,client_id:OURA.clientId()}),cache:"no-store"})}
    catch(e){throw ouraErr("Die Brücke zu Oura ist nicht erreichbar. Stimmt die Adresse?","net")}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok||!j.access_token){
      const e=typeof j.error==="string"&&/^[a-z_]{1,40}$/.test(j.error)?j.error:"";
      throw ouraErr(e==="no_secret"?"In der Brücke fehlt noch das Client Secret (Anleitung, Schritt 2).":e==="invalid_client"?"Oura kennt diese Client ID oder dieses Client Secret nicht. Prüf beides.":e==="invalid_grant"?"Die Anmeldung bei Oura gilt nicht mehr. Bitte neu anmelden.":r.status===404||r.status===405?"Die Brücke ist veraltet. Ersetz den Code im Worker durch den aus der Anleitung.":e==="oura_unreachable"||r.status>=502?"Oura ist gerade nicht erreichbar. Versuch es später noch mal.":"Die Anmeldung bei Oura hat nicht geklappt"+(e?" ("+e+")":"")+".",e==="invalid_grant"?"auth":"token");
    }
    // Erneuerungs-Schlüssel gelten nur einmal: den neuen sofort speichern
    const t={v:String(j.access_token),r:j.refresh_token?String(j.refresh_token):(params.refresh_token||null),exp:Date.now()+Math.min(Number(j.expires_in)||86400,31*86400)*1000-60000,scope:String(j.scope||""),iat:Date.now()};
    store.set("nw_oura_tok",t);store.del("nw_oura_moved");return t;
  },
  // stale = der Schlüssel, den Oura gerade abgelehnt hat
  async access(stale){
    const t=OURA.token();if(!t) throw ouraErr("Nicht mit Oura verbunden.","auth");
    if(stale&&t.v!==stale) return t.v;
    if(!stale&&(!t.exp||t.exp>Date.now()+5*60e3)) return t.v;
    if(!t.r){if(!stale&&t.exp>Date.now())return t.v;store.del("nw_oura_tok");throw ouraErr("Die Anmeldung bei Oura ist abgelaufen. Bitte neu anmelden.","auth")}
    // Nur eine Erneuerung gleichzeitig, sonst verbraucht ein zweiter Aufruf den Schlüssel umsonst
    if(!OURA._ref){const r0=t.r;OURA._ref=OURA.tokenCall({grant_type:"refresh_token",refresh_token:r0}).catch(e=>{
      // Hat ein anderes Fenster gleichzeitig erneuert, gilt dessen neuer Schlüssel
      const c=store.get("nw_oura_tok",null);if(c&&c.r&&c.r!==r0)return c;
      // Riss die Verbindung mitten in der Erneuerung ab, ist der alte Schlüssel bei Oura womöglich schon verbraucht
      if(e.code==="net")store.set("nw_oura_cut",r0.slice(-8));
      if(e.code==="auth"){store.del("nw_oura_tok");if(store.get("nw_oura_cut","")===r0.slice(-8))e.message="Die Verbindung brach bei der letzten Erneuerung ab. Bitte einmal neu anmelden.";store.del("nw_oura_cut")}
      throw e}).finally(()=>{OURA._ref=null})}
    return (await OURA._ref).v;
  },
  // Nur löschen, wenn noch genau dieser Schlüssel gespeichert ist
  drop(v){const c=store.get("nw_oura_tok",null);if(c&&c.v===v)store.del("nw_oura_tok")},
  // Beim Trennen auch bei Oura abmelden, damit ein kopierter Code nichts mehr öffnet. Fehler sind egal
  revoke(t){const px=OURA.proxy();if(!px||!t)return;
    [t.r,t.v].filter(Boolean).forEach(tok=>fetch(px+"/oauth/revoke",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({token:tok,token_type_hint:tok===t.r?"refresh_token":"access_token",client_id:OURA.clientId()}),cache:"no-store",keepalive:true}).catch(()=>{}))},
  async get(path,params){
    const px=OURA.proxy();if(!px) throw ouraErr("Bitte die Brücken-Adresse eintragen (Oura-Fenster).","auth");
    const mk=extra=>px+"/v2/usercollection/"+path+"?"+new URLSearchParams({...params,...extra});
    let url=mk({}),all=[],retried=false;
    for(let guard=0;guard<12&&url;guard++){
      const v=await OURA.access();
      let r;try{r=await fetch(url,{headers:{Authorization:"Bearer "+v},cache:"no-store"})}catch(e){throw ouraErr("Die Brücke zu Oura ist nicht erreichbar. Stimmt die Adresse?","net")}
      if(r.status===401){
        const txt=await r.text().catch(()=>"");
        // Fehlende Freigabe: ein neuer Schlüssel hilft nicht. Ohne SpO2 geht es trotzdem weiter
        if(/scope/i.test(txt)){if(path==="daily_spo2")return all;OURA.drop(v);throw ouraErr("Oura hat die Freigabe für Schlafdaten nicht erteilt. Melde dich neu an und lass bei Oura „daily“ angehakt.","auth")}
        // Einmal mit frischem Schlüssel versuchen, dann erst aufgeben
        if(!retried&&OURA.token()?.r){retried=true;await OURA.access(v);continue}

/* ===== Beispieldaten (erfunden, nur zum Ausprobieren) ===== */
function demoData(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const sleep=[],ready=[],act=[];
  for(let i=34;i>=1;i--){
    const day=addDays(localKey(),-i), prev=addDays(day,-1);
    const bed=new Date(prev+"T23:30:00");bed.setMinutes(bed.getMinutes()+Math.round((rnd()-.4)*90));
    const tib=Math.round(430+rnd()*80), end=new Date(bed.getTime()+tib*6e4);
    const awake=Math.round(30+rnd()*50), total=tib-awake, deep=Math.round(total*(.18+rnd()*.06)), rem=Math.round(total*(.19+rnd()*.06));
    sleep.push([day,bed.toISOString(),end.toISOString(),total,rem,deep,total-deep-rem,awake,Math.round(total/tib*100),Math.round(300+rnd()*600),Math.round(48+rnd()*6),Math.round(60+rnd()*40),Math.round(62+total/tib*14+rnd()*8),15+rnd()]);
    ready.push([day,Math.round(70+rnd()*20),Math.round(60+rnd()*25),85,80,90,70,90,(rnd()-.5)*.4]);
    act.push([prev,Math.round(80+rnd()*18),Math.round(3000+rnd()*9000),Math.round(200+rnd()*600)]);
  }
  return {sleep,ready,act,spo2:[]};
}

let liveState={btn:null};
const TOOLS_MCP={sleep:"get_sleep",ready:"get_readiness",act:"get_activity"};
const live={};
const RANGE=()=>({from_date:addDays(localKey(),-60),to_date:addDays(localKey(),1),limit:100});
function toCompact(kind,p){
  try{
    if(kind==="sleep")return (p.sleep||[]).map(r=>[r.date,r.bedtime_start,r.bedtime_end,r.total_sleep_minutes,r.rem_minutes,r.deep_minutes,r.light_minutes,r.awake_minutes,r.sleep_efficiency_percent,r.sleep_latency_seconds,r.lowest_heart_rate,r.avg_hrv,r.sleep_score,r.avg_breath_rate??null]);
    if(kind==="ready")return (p.readiness||[]).map(r=>{const c=r.contributors||{};return [r.date,r.readiness_score,c.sleep_balance,c.hrv_balance,c.recovery_index,c.resting_heart_rate,c.previous_night,c.activity_balance,c.temperature_deviation??0]});
    if(kind==="act")return (p.activity||[]).map(r=>[r.date,r.activity_score,r.steps,r.calories_active]);
  }catch(e){}return null;
}
function applyLive(kind,payload){
  const c=toCompact(kind,payload);if(!c||!c.length)return;
  live[kind]=c;
  if(kind==="sleep"){const lo=c.reduce((a,r)=>String(r[0])<a?String(r[0]):a,String(c[0][0]));DATA={...DATA,sleep:DATA.sleep.filter(r=>r[0]<lo)}}
  DATA=mergeData(DATA,{sleep:live.sleep||[],ready:live.ready||[],act:live.act||[]});
  if(kind==="sleep"){saveData("live");liveState.btn=null}else saveData();
  rebuild();
}
let mcpRef=null;
function onLiveError(err){
  const c=err&&err.code;
  if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required")liveState.btn="Live-Daten laden";
  else if(c==="needs_reauth"){liveState.btn=null;toast("Oura in claude.ai unter Einstellungen → Connectors neu verbinden")}
  else if(c==="server_not_connected"||c==="selection_required"){liveState.btn=null;toast("Oura unter Einstellungen → Connectors hinzufügen")}
  else if(err&&err.retryable)liveState.btn="Erneut versuchen";
  else liveState.btn="Live-Daten laden";
  keepScroll(render);
}
async function loadLiveOnce(){
  if(!mcpRef)return;liveState.btn="Lädt …";keepScroll(render);
  try{for(const k of Object.keys(TOOLS_MCP)){const r=await mcpRef.callTool("Oura",TOOLS_MCP[k],RANGE(),{cache:{staleTime:60000,gcTime:3600000}});applyLive(k,r.payload)}}
  catch(e){onLiveError(e)}
}
async function connectLive(){
  let mcp=null;try{mcp=await window.claude.use("mcp")}catch(e){}
  if(!mcp)return;mcpRef=mcp;
  Object.keys(TOOLS_MCP).forEach(k=>{
    try{mcp.watchTool("Oura",TOOLS_MCP[k],RANGE(),ev=>{if(ev.type==="data")applyLive(k,ev.result.payload);else if(k==="sleep")onLiveError(ev.error)},{cache:{staleTime:300000,gcTime:86400000},refetchInterval:1800000})}catch(e){}
  });
}
