<style>

 --bg:#eef2f6;--card:#fff;--ink:#132230;--mute:#5a6977;--line:#d7dfe7;--soft:#f5f8fb;

 --bg:#0f161d;--card:#17212b;--ink:#e6edf3;--mute:#97a6b4;--line:#293744;--soft:#1c2833;

*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--pf)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{padding:14px 0 10px}
.hd h1{margin:0;font-size:20px;line-height:1.25;font-weight:700}
.hd p{margin:2px 0 10px;color:var(--mute);font-size:14px}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pstat{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:5px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button[aria-current="page"]{background:var(--pf);border-color:var(--pf);color:var(--card)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pf);outline-offset:2px}
main{padding:18px 0 40px}
h2.v{font-size:22px;margin:0 0 4px;font-weight:700}
p.lead{margin:0 0 18px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
.card>h3{margin:0;padding:12px 16px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card>h3 small{font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.pad{padding:14px 16px}
.counters{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.counters div{padding:12px 14px;border-left:1px solid var(--line)}
.counters div:first-child{border-left:0}
.counters b{display:block;font-size:22px;line-height:1.1}
.counters span{font-size:13px;color:var(--mute)}
.today{font-size:15px}
.today b{font-weight:600}
/* task rows */
.task{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.task:last-child{border-bottom:0}
.task.k-pvl:not(.is-done){box-shadow:inset 4px 0 0 var(--pvl)}
.task.k-pflicht:not(.is-done){box-shadow:inset 4px 0 0 var(--pf)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--mute);border-radius:6px;background:transparent;cursor:pointer;display:grid;place-content:center}
input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ttl{font-weight:600}
.is-done .ttl{text-decoration:line-through;color:var(--mute);font-weight:500}
.tmeta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-top:2px;flex-wrap:wrap}
.tdesc{display:block;font-size:14px;color:var(--mute);margin-top:4px}
.is-done .tdesc{display:none}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:inline-block}
.c-psy{background:var(--psy)}.c-fome{background:var(--fome)}.c-wa{background:var(--wa)}.c-kv{background:var(--kv)}.c-allg,.c-stud{background:var(--allg)}
.tag{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:9px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.pvl{background:var(--pvlbg);color:var(--pvl)}
.tag.pflicht{background:var(--pfbg);color:var(--pf)}
.tag.wichtig{background:var(--warnbg);color:var(--warn)}
.tag.frei{background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.due{font-size:13px;font-weight:600;white-space:nowrap;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--mute)}
.due.over{background:var(--pvlbg);color:var(--pvl)}
.due.active{background:var(--okbg);color:var(--ok)}
.due.urgent{background:var(--warnbg);color:var(--warn)}
.due.done{background:transparent;color:var(--ok)}

.prow{margin:0 0 14px}.prow:last-child{margin:0}
.prow div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.prow .pbar i.pv{background:var(--pvl)}
/* week */
.wk{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk>span{padding:10px 16px;font-size:14px}
.wk>span:first-child{display:flex;align-items:flex-start;gap:8px;font-weight:600;color:var(--mute)}
.wk>span:first-child .dot{margin-top:6px}
.pv{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:8px;background:var(--pvlbg);color:var(--pvl);margin-right:6px;vertical-align:1px}
.wcard.now{border:2px solid var(--pf)}
.wcard.pause>h3{background:var(--soft)}
.nowtag{font-size:12px;font-weight:700;color:var(--card);background:var(--pf);padding:1px 8px;border-radius:9px}
.wcard.past{opacity:.6}
/* courses */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.pills button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chead{padding:16px;border-bottom:1px solid var(--line)}
.chead h3{margin:0 0 4px;font-size:19px;font-weight:700;display:flex;gap:10px;align-items:center}
.chead h3 .dot{width:12px;height:12px;flex-basis:12px}
.chead p{margin:0 0 10px;color:var(--mute)}
.links{display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.links a{border:1px solid var(--line);border-radius:6px;padding:4px 10px;text-decoration:none;background:var(--soft)}
.links span{border:1px dashed var(--line);border-radius:6px;padding:4px 10px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));border-bottom:1px solid var(--line)}
.cols>div{padding:14px 16px;border-left:1px solid var(--line)}
.cols>div:first-child{border-left:0}
.cols h4{margin:0 0 8px;font-size:14px;font-weight:700}
.cols h4.r{color:var(--pvl)}.cols h4.g{color:var(--mute)}.cols h4.b{color:var(--pf)}
.cols ul{margin:0;padding-left:18px;font-size:14px}
.cols li{margin-bottom:5px}
.sub{margin:0;padding:10px 16px;font-size:14px;font-weight:700;background:var(--soft);border-bottom:1px solid var(--line)}
.theme{display:grid;grid-template-columns:26px 28px 1fr auto;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;font-size:15px}
.theme:last-child{border-bottom:0}
.theme .n{font-weight:700;color:var(--mute);text-align:right}
.theme .w{font-size:13px;color:var(--mute);white-space:nowrap}
.theme.now{background:var(--pfbg)}
.theme.is-done .tt{text-decoration:line-through;color:var(--mute)}
/* filters */
.flt{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.flt button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;border-radius:16px;cursor:pointer}
.flt button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.empty{padding:14px 16px;color:var(--mute);font-size:14px}
/* info */
dl{margin:0}
dl div{padding:10px 16px;border-bottom:1px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{font-weight:600}
dd{margin:2px 0 0;color:var(--mute);font-size:14px}
.warnbox{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:12px 14px;margin:0 0 10px;font-size:14px}
.warnbox b{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:13px;color:var(--mute);margin:0 0 16px}
.reset{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer}
code{font-size:14px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (max-width:600px){
 .wk{grid-template-columns:1fr}
 .wk>span:first-child{padding-bottom:0}
 .counters b{font-size:19px}
 .task{grid-template-columns:26px 1fr}
 .task .due{grid-column:2;justify-self:start}
 .theme{grid-template-columns:26px 22px 1fr}
 .theme .w{grid-column:3}
 .cols>div{border-left:0;border-top:1px solid var(--line)}
 .cols>div:first-child{border-top:0}
}
@media (prefers-reduced-motion:reduce){.pbar i{transition:none}}
</style>
