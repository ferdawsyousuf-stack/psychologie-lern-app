 die Hälfte *gesagt*. / Er sprach *langsam*, / machte *Pausen*, / und der ganze *Tisch* / wurde *still*, / wenn er *anfing*.","Der *Regen* klopft ans Fenster, / ganz *gleichmäßig*. / Ich koche mir einen *Tee* / und setze mich ans *Licht*. / Heute muss nichts *perfekt* sein. / Es *reicht*, / wenn es *gut* ist.","Am *Meer* gibt es keinen Druck. / Die Wellen *kommen*, / die Wellen *gehen*. / Keine ist wie die *andere*, / und keine *entschuldigt* sich dafür. / Ich nehme mir ein *Beispiel*.","Sinatra *beobachtete* Tommy Dorsey, / den *Posaunisten*, / Abend für *Abend*. / Er wollte *wissen*, / wo er *atmet*. / Dann *übte* er, / bis seine Sätze / wie von *selbst* flossen.","Im *Zug* sitzt eine alte Dame. / Sie erzählt mir von *Paris*, / von einem kleinen *Café* / und einem *Lied*, / das sie nie *vergessen* hat. / Ich höre *zu* / und merke: / Gute Geschichten sind *einfach*.","Ein *Fehler* ist kein Urteil. / Er ist nur ein *Hinweis*, / wo ich *genauer* hinschauen kann. / Ich atme *aus*, / sage den Satz *nochmal* / und gehe *weiter*.","Im *Park* spielt ein Kind mit einem Ball. / Es denkt nicht *nach*, / ob es *gut* aussieht. / Es *lacht*, / es *rennt*, / es fällt *hin* / und steht wieder *auf*.","Die *Küche* ist warm, / das *Radio* läuft leise. / Meine Mutter schneidet *Zwiebeln* / und summt eine *Melodie*. / Sie singt nicht *perfekt*, / aber sie singt *gern*. / Und genau das *hört* man.","Wenn ich *spreche*, / spreche ich zu *einem* Menschen. / Nicht zu einer *Menge*, / nicht zu einem *Urteil*, / sondern zu einem *Gesicht*, / das mir *zuhört*.","Der erste *Kaffee* am Morgen / ist ein kleines *Ritual*. / Die Tasse ist *warm*, / der Tag noch *leer*. / Ich *entscheide*, / wie er klingen soll: / *ruhig*, / *klar* / und *freundlich*.","In den *Bergen* ist die Luft dünn. / Wer zu *schnell* geht, / kommt außer *Atem*. / Wer *gleichmäßig* geht, / kommt *weiter*. / Das gilt auch / für *Gespräche*.","Eine gute *Geschichte* hat drei Teile: / einen *Anfang*, / der neugierig *macht*, / eine *Mitte*, / die *überrascht*, / und ein *Ende*, / das man *mitnimmt*.","Auf dem *Markt* ruft ein Händler. / Seine Stimme ist *tief* / und völlig *entspannt*. / Er muss nicht *schreien*, / denn er *weiß*, / was er *verkauft*.","Gestern habe ich *Mut* gebraucht. / Mein Herz hat *geklopft*, / meine Hände waren *kalt*. / Ich habe *trotzdem* gesprochen. / Und weißt du *was*? / Die Welt ist nicht *untergegangen*.","Am *Bahnhof* warten viele Menschen. / Jeder hat ein *Ziel*, / jeder eine *Geschichte*. / Ich stelle mir *vor*, / wohin sie *fahren* / und wer *wartet*, / wenn sie *ankommen*.","Musik lebt von *Pausen*. / Ohne *Stille* / gäbe es keinen *Rhythmus*. / Beim *Sprechen* ist es genauso: / Die Pause *trägt*, / was danach *kommt*.","Mein *Freund* erzählt Witze / immer viel zu *schnell*. / Er lacht schon *vorher*, / und keiner versteht die *Pointe*. / Heute hat er es *langsam* versucht. / Zum ersten *Mal* / haben *alle* gelacht.","Im *Winter* wird es früh dunkel. / Wir zünden *Kerzen* an / und erzählen uns *Geschichten*. / Niemand schaut auf die *Uhr*. / Die *Zeit* gehört / heute *uns*.","Ein *Fremder* hat mich heute angelächelt, / einfach *so*. / Ich habe *zurückgelächelt*. / Für einen *Moment* / war der ganze *Stress* / ganz *klein*.","Das *Meer* von oben: / ein blaues *Tuch*, / auf dem kleine *Boote* liegen. / Von hier *oben* / wirken alle *Sorgen* / wie diese Boote: / *klein* / und weit *weg*.","Ein *Baum* wächst nicht in einer Nacht. / Jeder *Ring* im Holz / ist ein ganzes *Jahr*. / Auch meine *Stimme* wächst, / Ring für *Ring*, / Tag für *Tag*.","Sinatra sagte *sinngemäß*: / Der *Text* kommt zuerst. / Erst wenn man ihn *versteht*, / weiß man, / wo man *betont* / und wo man *leise* wird.","Heute koche ich für *Freunde*. / Es gibt *Pasta* / mit Tomaten und *Basilikum*. / Nichts *Kompliziertes*, / aber mit *Liebe* gemacht. / Am Ende zählt nicht das *Rezept*, / sondern der *Abend*.","Wer *zuhört*, / lernt mehr als *gedacht*. / Man hört *Worte*, / aber auch *Pausen*, / *Zögern* / und *Freude*. / Gutes Zuhören ist / die *leiseste* Form / von *Respekt*.","Im *Kino* wird es dunkel. / Das *Rascheln* hört auf. / Für zwei *Stunden* / bin ich in einer anderen *Welt*. / Danach gehe ich *langsam* nach Hause / und denke *nach*.","Auf dem *Balkon* wachsen Tomaten, / jeden Tag ein bisschen *mehr*. / Ich *gieße* sie, / ich *warte*, / und irgendwann / sind sie *rot*. / Geduld *schmeckt* / am Ende *süß*.","Ein *Gespräch* ist wie ein Tanz. / Einer *führt*, / der andere *folgt*, / dann *wechselt* es. / Niemand muss *perfekt* tanzen. / Es reicht, / im *Takt* zu bleiben.","Die *Sonne* geht unter / hinter den *Dächern*. / Der Himmel wird *orange*, / dann *rosa*, / dann *blau*. / Ich bleibe *stehen* / und *schaue*, / bis es *dunkel* ist.","Neue *Wege* machen nervös. / Das ist *normal*. / Der Körper sagt: / *Achtung*, / hier ist etwas *wichtig*. / Ich sage *danke* / und gehe den Weg *trotzdem*.","Am *Wochenende* fahre ich ans Wasser. / Ich nehme ein *Buch* mit, / eine *Decke* / und gar keinen *Plan*. / Manchmal / ist *nichts* zu tun / das *Beste*.","Ein guter *Witz* braucht Timing. / Zu *früh*, / und er verpufft. / Zu *spät*, / und er ist vorbei. / Genau im richtigen *Moment* / trifft er *mitten* ins Herz.","In der *Bibliothek* ist es still. / Man hört nur *Seiten*, / die *umgeblättert* werden. / Hier spricht *niemand* laut, / und trotzdem / erzählen tausend *Bücher* / gleichzeitig ihre *Geschichten*.","Ich stelle mir *vor*, / ich stehe auf einer *Bühne*. / Das Licht ist *warm*, / die Menschen *freundlich*. / Ich atme *aus* / und beginne / mit einem *Lächeln*.","Fahrradfahren hat mir mein *Vater* beigebracht. / Er ist *nebenher* gelaufen, / hat *festgehalten* / und irgendwann *losgelassen*. / Ich habe es erst *gemerkt*, / als ich schon *fuhr*.","Gute *Stimmen* sind nicht laut. / Sie sind *klar*. / Sie *wissen*, / was sie sagen wollen, / und lassen jedem *Wort* / seinen *Platz*.","Der *Hafen* am Morgen: / *Möwen*, / *Salz* in der Luft / und Fischer, / die ihre *Netze* flicken. / Jeder hier hat seinen *Rhythmus*, / und keiner *hetzt*.","Heute war ein *normaler* Tag. / Nichts *Besonderes*, / nichts *Schlimmes*. / Und *doch*: / ein gutes *Gespräch*, / ein warmes *Essen*, / ein *Lachen*. / Vielleicht sind normale Tage / die *besten*."],ea=["Was hat dich heute überrascht?","Welcher Ort in deiner Stadt wird unterschätzt?","Was war das beste Essen, das du je hattest?","Welche Fähigkeit hättest du gern sofort?","Was macht einen guten Gastgeber aus?","Wohin würdest du morgen reisen, wenn alles bezahlt wäre?","Was hat dich diese Woche zum Lachen gebracht?","Welcher Song läuft gerade in deinem Kopf und warum?","Was würdest du einem Freund raten, der vor einem Gespräch nervös ist?","Was war dein Lieblingsspiel als Kind?","Welcher Film hat dich zuletzt berührt?","Was machst du an einem perfekten Sonntag?","Welche Jahreszeit magst du am liebsten und warum?","Wer hat dir etwas Wichtiges beigebracht?","Was würdest du mit einer freien Woche anfangen?","Welches Essen kannst du richtig gut kochen?","Was ist das Schönste an deinem Viertel?","Welche Erfindung findest du genial?","Was nervt dich im Alltag, und wie gehst du damit um?","Welches Tier wärst du gern für einen Tag?","Was war dein bester Urlaub?","Was bedeutet Freundschaft für dich?","Welche Gewohnheit tut dir richtig gut?","Was würdest du deinem 15-jährigen Ich sagen?","Welches Buch oder welche Serie empfiehlst du gerade?","Was ist dein Lieblingsgeräusch?","Wo fühlst du dich zu Hause?","Was hast du zuletzt zum ersten Mal gemacht?","Welcher Mensch inspiriert dich?","Was ist für dich ein guter Feierabend?","Welche Musik hörst du, wenn du gute Laune willst?","Was hast du dieses Jahr gelernt?","Wie sieht für dich ein perfektes Frühstück aus?","Was würdest du erfinden, wenn du könntest?","Was ist das Mutigste, das du je getan hast?","Welche Stadt möchtest du unbedingt einmal sehen?","Was macht einen guten Tag aus?","Erzähl von einem Moment, in dem du stolz auf dich warst.","Was magst du an deiner Arbeit?","Welcher Duft erinnert dich an früher?","Wie würdest du einem Touristen deine Stadt zeigen?","Was ist dein liebstes Ritual am Morgen?","Welche Sportart würdest du gern können?","Was ist das beste Geschenk, das du je bekommen hast?","Welcher Rat hat dir wirklich geholfen?","Was würdest du tun, wenn du einen Tag unsichtbar wärst?","Wofür bist du heute dankbar?","Welche kleine Sache macht dich sofort glücklich?","Was war dein peinlichster, aber lustigster Moment?","Wie stellst du dir dein Leben in fünf Jahren vor?","Welches Gericht aus einem anderen Land liebst du?","Wo denkst du am besten nach?","Welche Superkraft hättest du gern?","Was hast du von deinen Eltern gelernt?","Welches Wetter magst du am liebsten?","Was würdest du gern besser können?","Erzähl von einem Abend, den du nie vergisst.","Was macht für dich gute Musik aus?","Auf welche App könntest du sofort verzichten?","Was würdest du kochen, wenn Sinatra zu Besuch käme?"],H1=["Erzähl in drei Sätzen, was heute passiert ist.","Beschreib in drei Sätzen deinen Weg zur Arbeit.","Sag in drei Sätzen, was du an deinem besten Freund magst.","Erklär in drei Sätzen, wie man dein Lieblingsessen kocht.","Beschreib in drei Sätzen dein Zimmer.","Sag in drei Sätzen, was du am Wochenende vorhast.","Empfiehl in drei Sätzen einen Film.","Beschreib in drei Sätzen das Wetter von heute.","Erzähl in drei Sätzen von deinem letzten Urlaub.","Sag in drei Sätzen, warum du gern dort wohnst, wo du wohnst.","Beschreib in drei Sätzen einen Menschen, den du magst.","Erklär in drei Sätzen, wofür du dein Handy am meisten nutzt.","Sag in drei Sätzen, was dich glücklich macht.","Beschreib in drei Sätzen ein Foto, an das du dich gern erinnerst.","Erzähl in drei Sätzen, was du gestern Abend gemacht hast.","Sag in drei Sätzen, was du heute noch erledigen willst.","Beschreib in drei Sätzen deinen Lieblingsort.","Erklär in drei Sätzen eine Regel aus deinem Lieblingsspiel.","Sag in drei Sätzen, welche Musik du magst und warum.","Beschreib in drei Sätzen einen guten Morgen.","Gib in drei Sätzen einen Tipp gegen Stress.","Erzähl in drei Sätzen, was du zuletzt gelernt hast.","Beschreib in drei Sätzen deine Stadt für jemanden, der nie dort war.","Sag in drei Sätzen, was du bei der Arbeit gut kannst.","Erklär in drei Sätzen, warum Pausen wichtig sind.","Beschreib in drei Sätzen ein Geräusch, das du magst.","Sag in drei Sätzen, worauf du dich diese Woche freust.","Erzähl in drei Sätzen von einem Tier, das du kennst.","Beschreib in drei Sätzen ein Essen, ohne seinen Namen zu sagen.","Sag in drei Sätzen, was einen guten Freund ausmacht."],V1=["Das war *wirklich* ein richtig *guter* Tag.","Ich habe *heute* etwas *Neues* gelernt.","Das ist die *beste* Idee seit *Langem*.","Hast du das *gesehen*? Das war *unglaublich*!","Ich freue mich *riesig* auf das *Wochenende*.","Dieser Kaffee ist *genau* richtig *heute*.","Das hast du *wirklich* großartig *gemacht*.","Ich war noch *nie* so *entspannt*.","Weißt du, was das *Schönste* daran *war*?","Das ist nicht *irgendein* Lied, das ist *Sinatra*.","Morgen wird es *richtig* schön *sonnig*.","Ich *kann* das, und ich *will* das.","Stell dir *vor*, wir fahren ans *Meer*.","Das Essen war *einfach* nur *fantastisch*.","Endlich ist *Freitag*, endlich *Feierabend*!","Ich habe *dich* so *lange* nicht gesehen.","Das ist *genau* das, was ich *meine*.","Was für ein *schöner* Abend *heute*.","Du glaubst nicht, *wen* ich *getroffen* habe.","Das Konzert war *laut*, aber *wunderbar*.","Heute probiere ich etwas ganz *Neues*, *versprochen*.","Ich *liebe* den Duft von frischem *Brot*.","Das war *knapp*, aber wir haben es *geschafft*.","*Ruhig* bleiben, *langsam* sprechen.","Das klingt *spannend*, erzähl *mehr*!","Ich hätte *nie* gedacht, dass es so *leicht* ist.","Wir sehen uns *morgen*, ich *freu* mich.","Das ist *mein* Lieblingsplatz in der *Stadt*.","Was für eine *Überraschung*, ich bin *sprachlos*!","Jeden Tag ein *bisschen* besser, *Schritt* für Schritt."],E1=["Alles gut. Wir finden eine Lösung. Lass uns kurz durchatmen.","Ich verstehe dich. Erzähl mir in Ruhe, was passiert ist.","Kein Stress. Wir machen einen Schritt nach dem anderen.","Das klingt anstrengend. Ich bin da und höre zu.","Wir haben Zeit. Niemand muss sich beeilen.","Danke, dass du das sagst. Lass uns gemeinsam schauen.","Das schaffen wir. Ganz ruhig, eins nach dem anderen.","Ich nehme mir kurz Zeit und antworte dir dann.","Guten Abend. Schön, dass du da bist. Mach es dir bequem.","Lass uns kurz innehalten. Was ist dir jetzt am wichtigsten?","Das ist ein guter Punkt. Ich denke kurz darüber nach.","Du bist nicht allein damit. Wir klären das zusammen.","Ich habe dich gehört. Und ich nehme das ernst.","Erst atmen, dann sprechen. Wir haben alle Zeit der Welt.","Willkommen zurück. Wie war deine Woche?","Alles der Reihe nach. Fang einfach vorne an.","Ich bin mir sicher, dass wir einen Weg finden.","Das ist okay. Fehler passieren. Wir machen weiter.","Ruhig. Klar. Langsam. So klingt Vertrauen.","Danke für deine Geduld. Das bedeutet mir viel.","Schön, dich zu sehen. Wie geht es dir wirklich?","Ich höre dir zu. Nimm dir die Zeit, die du brauchst.","Das klingt nach einem langen Tag. Setz dich erst mal.","Wir müssen das nicht heute lösen. Morgen ist auch ein Tag.","Gute Nacht. Schlaf gut. Morgen wird ein guter Tag."],T1=["sss","fff","sch"],N1=["Augen zu, spür den Atem an der Nase.","Augen zu, spür, wie sich der Bauch hebt und senkt.","Augen zu, zähl die Ausatmer von 1 bis 10, dann von vorn.","Augen zu, spür den Atem im Brustkorb."],D1=["Blick nach außen: Welche Augenfarbe hat die Person?","Blick nach außen: Was hält die Person in der Hand?","Blick nach außen: Welche Farbe hat ihre Kleidung?","Blick nach außen: Wie klingt ihre Stimme gerade?","Blick nach außen: Was steht hinter ihr im Raum?","Blick nach außen: Lächelt sie gerade, oder ist sie konzentriert?","Blick nach außen: Welches Detail fällt dir an ihr zuerst auf?","Blick nach außen: Wie ist das Licht im Raum?","Blick nach außen: Was hat sie gerade als Letztes gesagt?","Blick nach außen: Welche drei Dinge siehst du um sie herum?"],Ar=(t,e)=>e.map(r=>({cat:t,text:r})),Bn=[...Ar("Vorstellen",["Stell dich vor, als wärst du Gastgeber eines schönen Abends.","Stell dich in einer Minute vor: Name, was du magst, was dich ausmacht.","Stell dich vor, als würdest du heute einen neuen Job beginnen.","Stell dich einer Gruppe vor, die dich noch nicht kennt.","Stell dich vor, als wärst du Moderator einer Radiosendung.","Begrüß neue Nachbarn und erzähl kurz von deiner Straße.","Stell dein Lieblingshobby vor, als wäre es eine eigene Fernsehsendung.","Stell dich vor, als wärst du Kapitän eines Schiffs kurz vor der Abfahrt."]),...Ar("Toast",["Halte einen kurzen Toast auf einen guten Freund.","Halte einen Toast auf deine Familie.","Halte eine Geburtstagsrede für jemanden, den du magst.","Halte einen Toast auf das Wochenende.","Halte eine kurze Rede zum Abschied eines Kollegen.","Bedank dich vor allen Gästen bei jemandem, der dir geholfen hat.","Halte einen Toast auf das neue Jahr."]),...Ar("Überzeugen",["Überzeug uns in einer Minute von deinem Lieblingsfilm.","Überzeug uns, dass Frühstück die beste Mahlzeit ist.","Überzeug uns, mehr spazieren zu gehen.","Überzeug uns, deine Stadt zu besuchen.","Überzeug uns, dass Pausen produktiv sind.","Überzeug uns von deiner Lieblingsmusik.","Überzeug uns, ein neues Hobby anzufangen.","Überzeug uns, heute früher schlafen zu gehen.","Empfiehl uns ein Essen, das jeder einmal probieren sollte."]),...Ar("Erzählen",["Erzähl von einem Ort, an dem du dich frei fühlst.","Erzähl, was dich diese Woche zum Lachen gebracht hat.","Erzähl von einem Menschen, den du bewunderst, und warum.","Erzähl von deinem schönsten Ferientag als Kind.","Erzähl von einer Begegnung mit einem Fremden, die du nicht vergisst.","Erzähl von einem Moment, in dem du mutig warst.","Erzähl von deinem Lieblingsessen und wer es für dich gekocht hat.","Erzähl von einem Tag, an dem alles schiefging, und wie er endete.","Erzähl von einem Geschenk, das dir viel bedeutet.","Erzähl von einer Reise, die dich verändert hat."]),...Ar("Erklären",["Erklär einem Kind, was du bei der Arbeit machst.","Erklär, wie man den perfekten Kaffee macht.","Erklär einem Touristen, wie man sich in deiner Stadt zurechtfindet.","Erklär, warum Schlaf so wichtig ist.","Erklär die Regeln deines Lieblingsspiels.","Erklär, wie man einen Fahrradreifen flickt.","Erklär einem Freund, wie zyklisches Seufzen geht.","Erklär, was ein gutes Gespräch ausmacht.","Verrat uns einen Tipp, der dein Leben leichter gemacht hat."]),...Ar("Sinatra-Moment",["Begrüß dein Publikum, als wärst du Sinatra in Las Vegas.","Kündige den nächsten Song an, als wärst du Showmaster in den 60ern.","Erzähl, warum dich eine bestimmte Stimme fasziniert.","Moderier einen Abend mit Live-Musik, ganz entspannt und charmant.","Verabschiede dein Publikum nach einem großen Konzert.","Bedank dich beim Orchester, als wärst du der Star des Abends."]),...Ar("Meinung",["Was ist wichtiger: Talent oder Übung? Sag deine Meinung.","Sollte man im Urlaub erreichbar sein? Begründe deine Meinung.","Stadt oder Land: Wo lebt man besser?","Ist Pünktlichkeit überbewertet? Sag, was du denkst.","Sollten Handys beim Essen weg? Begründe es.","Morgenmensch oder Nachtmensch: Was ist besser?","Was macht einen guten Chef aus?"]),...Ar("Fantasie",["Du hast eine Zeitmaschine. Wohin reist du und warum?","Du darfst ein Restaurant eröffnen. Wie sieht es aus?","Du bist für einen Tag Bürgermeister. Was änderst du?","Du wachst in einer fremden Stadt auf. Was machst du zuerst?","Du gewinnst eine Reise für zwei. Wen nimmst du mit?","Du darfst ein Lied für die ganze Welt spielen. Welches und warum?"])],bn=(t,e)=>e.map(([r,a])=>({level:t,title:r,text:a})),O1=[...bn(1,[["Drei Mini-Sätze","Sprich heute drei fremde Menschen kurz an: Frag, wo etwas steht, grüß jemanden mit einem Satz und wünsch an der Kasse einen schönen Tag."],["Nach dem Weg fragen","Frag eine fremde Person nach dem Weg oder nach der Uhrzeit, auch wenn du es eigentlich weißt. Bedank dich mit einem ganzen Satz."],["Ein kleines Kompliment","Mach heute einer fremden Person ein ehrliches, kleines Kompliment, zum Beispiel zu einer Jacke oder einem Hund."],["Klar bestellen","Bestell heute irgendwo etwas mit ruhiger, klarer Stimme und schau dabei die Person an."],["Einen Satz mehr","Grüß heute zwei Nachbarn oder Kollegen mit einem Satz mehr als sonst, zum Beispiel: „Schönen Feierabend nachher!“"],["Um Rat fragen","Frag im Laden nach einer Empfehlung, zum Beispiel welches Brot heute am besten ist."]]),...bn(2,[["Eine echte Rückfrage","Stell einer fremden Person eine echte Frage, zum Beispiel wie ihr Tag läuft, und hör dir die Antwort ganz an."],["Smalltalk übers Wetter","Sag einer fremden Person etwas zum Wetter und stell eine Frage hinterher."],["Nachfragen statt nicken","Wenn dir heute jemand etwas erzählt, stell eine Nachfrage, bevor du antwortest."],["Eine Empfehlung geben","Empfiehl heute jemandem etwas, das du magst, und nenn einen Grund dafür."],["Anrufen statt schreiben","Ruf heute irgendwo an, wo du sonst eine Nachricht schreiben würdest, und frag etwas."],["Zwei ehrliche Sätze","Wenn dich heute jemand fragt, wie es dir geht, antworte mit zwei ehrlichen Sätzen statt nur mit „gut“."]]),...bn(3,[["Ein echter Moment","Bemerk etwas Echtes und sprich es aus, so wie bei den Croques. Einmal bei der Arbeit, einmal woanders."],["Etwas Gutes benennen","Sag heute einer Person, was dir an ihr oder ihrer Arbeit positiv aufgefallen ist."],["Eine kleine Geschichte","Erzähl heute jemandem in drei Sätzen etwas, das dir gestern passiert ist."],["Lachen teilen","Wenn dich heute etwas zum Schmunzeln bringt, sprich es laut aus, statt es nur zu denken."],["Meinung sagen","Sag heute einmal deine ehrliche Meinung zu etwas Kleinem, zum Beispiel zu Musik oder Essen."],["Danke mit Grund","Bedank dich heute bei jemandem und sag dazu, warum es dir geholfen hat."]]),...bn(4,[["Unter Freunden","Erzähl Freunden eine kleine Beobachtung aus deinem Tag, drei bis vier Sätze. Schau dabei in ihre Gesichter."],["Das Thema setzen","Fang bei Freunden heute selbst ein Thema an, statt zu warten, bis jemand anderes etwas sagt."],["Eine Frage in die Runde","Stell in einer Gruppe eine Frage an alle und hör dir die Antworten an."],["Eine gemeinsame Erinnerung","Erzähl Freunden eine lustige Erinnerung, die ihr zusammen habt."],["Zu Ende sprechen","Erzähl Freunden etwas und sprich bis zum Ende, auch wenn jemand dazwischenredet. Freundlich, aber ganz."],["Sprachnachricht","Schick einem Freund eine Sprachnachricht von 30 Sekunden statt einer Textnachricht."]]),...bn(5,[["Bewusst langsam","Sprich in einem Gespräch absichtlich langsamer, obwohl der Impuls „schneller“ sagt. Beobachte, was wirklich passiert."],["Pause aushalten","Mach mitten in einem Satz bewusst zwei Sekunden Pause. Beobachte, wie dein Gegenüber reagiert."],["Blick halten","Halte in einem Gespräch den Blickkontakt bis zum Ende deines Satzes."],["Ohne Entschuldigung","Wenn du dich heute versprichst, sag den Satz einfach nochmal, ohne dich zu entschuldigen."],["Eine Minute am Stück","Erzähl heute einmal mindestens eine Minute am Stück, ohne abzukürzen."],["In der Runde","Sag heute in einer Gruppe von drei oder mehr Menschen einen ganzen Gedanken laut."]])],xl=t=>O1.filter(e=>e.level===t),kg=t=>O1.find(e=>e.title===t),Kv=vl.length+ea.length+H1.length+V1.length+E1.length+Bn.length+O1.length;var vg=[{id:1,label:"Ruhe & Atem"},{id:2,label:"Fokus statt Kopfkino"},{id:3,label:"Tempo & Klarheit"},{id:4,label:"Stimme & Melodie"}],xg=[2,4],Ll={text:{list:vl,label:"Dein Text",shuffle:"Anderer Text",salt:0,reading:!0},textEmphasis:{list:vl,label:"Dein Text",shuffle:"Anderer Text",salt:20,reading:!0,marked:!0},questions:{list:ea,label:"Deine Frage",shuffle:"Neue Frage",salt:0},clear:{list:H1,label:"Deine Aufgabe",shuffle:"Andere Aufgabe",salt:0},melody:{list:V1,label:"Dein Satz",shuffle:"Anderer Satz",salt:0,marked:!0,quote:!0},calm:{list:E1,label:"Dein Satz",shuffle:"Anderer Satz",salt:0,quote:!0}},Lg=["Tief durch die Nase einatmen.","Oben kurz nachatmen, ein zweiter kleiner Zug.","Langsam durch den Mund aus, länger als das Einatmen."],mg="Balban, Spiegel, Huberman u. a., Stanford, Cell Reports Medicine 2023",Mg={id:"warmup-sigh",kind:"breath",tag:"Neurowissenschaft · Ankommen",title:"Zyklisches Seufzen",minutes:1,seconds:57,cycles:6,steps:Lg,why:"Langes Ausatmen aktiviert das Ruhesystem des Körpers und bremst den Puls. Ein ruhiger Atem ist der Treibstoff für ruhiges Sprechen.",source:mg},yg={1:[{id:"sigh",kind:"breath",tag:"Neurowissenschaft · Atem",title:"Zyklisches Seufzen",minutes:3,seconds:171,cycles:18,steps:Lg,why:"In der Stanford-Studie hob diese Atmung die Stimmung stärker als Achtsamkeitsmeditation und senkte die Atemfrequenz in Ruhe. Geübt wurde 5 Minuten täglich.",source:mg},{id:"sss",kind:"hold",tag:"Stimmtraining · Atem",title:"Atem für lange Sätze",minutes:3,seconds:180,steps:["Kurz durch die Nase einatmen.","Kreis halten und leise auf „{laut}“ ausatmen.","Loslassen, wenn die Luft ausgeht. Nicht pressen."],why:"Sinatra ging auf frühen Radioaufnahmen hörbar die Luft aus. Er trainierte gezielt seine Atemkontrolle und sang danach deutlich längere Phrasen.",source:"Jazz History Online; Sinatra in LIFE (1965) über Tommy Dorsey"}],2:[{id:"att",kind:"timer",tag:"Psychologie · Metakognitive Therapie",title:"Aufmerksamkeit lenken",minutes:3,seconds:180,steps:["Blick auf einen Punkt. Minute 1: ein Geräusch halten.","Minute 2: alle paar Sekunden zu einem anderen springen.","Minute 3: alle Geräusche gleichzeitig hören."],phases:[{at:0,label:"Ein Geräusch halten"},{at:60,label:"Zwischen Geräuschen springen"},{at:120,label:"Alles gleichzeitig hören"}],why:"Trainiert, deine Aufmerksamkeit bewusst nach außen zu lenken, statt dich selbst zu beobachten. Genau das brauchst du mitten im Gespräch.",source:"Adrian Wells, Univ. Manchester: Attention Training Technique (Kurzform, Original 12 Min.)"},{id:"meditation",kind:"timer",tag:"Neurowissenschaft · Achtsamkeit",title:"Atem-Meditation",minutes:3,seconds:180,steps:["{anker}","Abgeschweift? Tippe auf „Zurück zum Atem“.","Sanft zurückkommen. Jede Rückkehr ist eine Wiederholung."],counterLabel:"Zurück zum Atem",why:"Nach einem Achtsamkeitstraining waren Menschen mit sozialer Angst weniger ängstlich und sahen sich positiver. Ihre Amygdala reagierte ruhiger auf negative Gedanken über sich selbst.",source:"Goldin & Gross, Stanford, Emotion 2010"}],3:[{id:"units",kind:"speak",tag:"Sprecherziehung · Tempo",title:"Lesen in Sinneinheiten",minutes:3,seconds:90,content:"text",steps:["Langsamer, als es sich richtig anfühlt.","Bei jedem / kurz stoppen und nachatmen.","Wortenden sauber, das Satzende sinkt."],why:"Angst belegt einen Teil des Arbeitsgedächtnisses, der dann fürs Formulieren fehlt. Pausen an Sinngrenzen geben dir Zeit zum Atmen und Denken.",source:"Eysenck u. a., Attentional Control Theory, Emotion 2007"},{id:"clear",kind:"speak",tag:"Linguistik · Klare Sprache",title:"Klar statt weich",minutes:3,seconds:60,content:"clear",steps:["Kein „irgendwie“, „vielleicht“ oder „ähm“.","Jedes Satzende sinkt wie ein Punkt.","Lieber kurz schweigen als füllen."],why:"In Studien wirkten Sprecher mit Zögerlauten, Weichmachern und Frage-Betonung weniger überzeugend und weniger kompetent.",source:"Erickson, Lind, Johnson & O’Barr, 1978"},{id:"prep",kind:"speak",tag:"Rhetorik · Struktur",title:"Gedanken ordnen",minutes:3,seconds:60,content:"questions",steps:["Punkt: deine Aussage in einem Satz.","Grund und Beispiel: warum, was erlebt?","Punkt: Aussage wiederholen. Fertig."],why:"Die PREP-Struktur entlastet den Kopf. Du musst nicht überlegen, was als Nächstes kommt, nur noch, was du sagen willst.",source:"Spontanrede-Training, z. B. „Table Topics“ bei Toastmasters"}],4:[{id:"sinatra",kind:"speak",tag:"Sinatra · Phrasierung",title:"Sprechen wie Sinatra",minutes:3,seconds:90,content:"textEmphasis",steps:["Markiertes Wort länger und wärmer.","Nach jedem Punkt innerlich „eins“ zählen.","Sprich zu einer Person, nicht zu vielen."],why:"Sinatra stellte den Text an erste Stelle: erst verstehen, dann entscheiden, wo betont und wo leise wird. Oft sang er minimal hinter dem Takt. Das klingt entspannt statt gehetzt.",source:"Sinatra-Zitat in Elsewhere; Wikipedia: Frank Sinatra’s recorded legacy"},{id:"melody",kind:"speak",tag:"Stimmforschung · Melodie",title:"Melodie-Leiter",minutes:3,seconds:60,content:"melody",steps:["20 Sekunden summen, Ton gleiten lassen.","Satz erst ganz flach, dann übertrieben.","Dann halb so viel. Betonung auf den markierten Wörtern."],why:"Ob eine Stimme lebendig und charismatisch wirkt, hängt stark an der Tonhöhe und ihrer Variation, am Tempo und an der Lautstärke. Studien zeigen: Charisma lässt sich trainieren.",source:"Frontiers in Communication 2020; Antonakis u. a. 2011; Summen: Titze 2006"},{id:"dj",kind:"speak",tag:"Praxis · FBI-Verhandlung",title:"Ruhige Stimme",minutes:3,seconds:60,content:"calm",steps:["Etwas tiefer ansetzen, langsam, warm.","Jedes Satzende sinkt nach unten.","Leicht lächeln. Das hört man."],why:"Der frühere FBI-Verhandler Chris Voss nutzt diese tiefe, langsame Stimme mit fallenden Satzenden, um angespannte Gespräche zu beruhigen.",source:"Chris Voss, „Never Split the Difference“; CNBC 2020"}]},wg=[{label:"Vorher",text:"Zweimal seufzen, dann leise: „Ich bin aufgeregt.“"},{label:"Dabei",text:"Wenn ich abschweife, atme ich aus und schaue auf ein Detail vor mir."},{label:"Danach",text:"Was hatte ich befürchtet, und was ist wirklich passiert?"}],U1={why:"Selbstvertrauen wächst am stärksten durch gemeisterte Erfahrungen. Du musst nicht warten, bis du dich bereit fühlst.",source:"Bandura 1977; Brooks 2014; Gollwitzer 1999; Clark & Wells 1995"},Cg=[{id:"better",label:"Besser als befürchtet"},{id:"expected",label:"Wie erwartet"},{id:"harder",label:"Schwieriger als gedacht"},{id:"notyet",label:"Noch nicht gemacht"}],Z1={why:"Angst macht Vorhersagen. Hier sammelst du Beweise, ob sie stimmen.",source:"Clark & Wells 1995: Verhaltensexperimente"},bg=["Zweimal seufzen: doppelt ein, lang aus.","Leise sagen: „Ich bin aufgeregt.“"],_1={why:"Aufregung umdeuten statt unterdrücken: In Harvard-Studien schnitten Menschen damit beim Reden besser ab als mit dem Versuch, sich zu beruhigen.",source:"Alison Wood Brooks, Harvard, 2014"},Bg=["Hör dir die Aufnahme an wie eine fremde Person.","Achte nur auf drei Dinge: Pausen, Satzenden, Tempo.","Merk dir einen Punkt fürs nächste Mal."],G1={why:"Wie wir uns fühlen und wie wir klingen, liegt oft weit auseinander. Aufnahmen zeigen dir die Wirklichkeit statt das Kopfkino.",source:"Clark & Wells: Video-Feedback in der Therapie sozialer Angst"},ml=60,q1={why:"Menschen reagieren sogar auf ein rein virtuelles Publikum, als wäre es echt. Darum wirkt das Üben vor vorgestellten Zuhörern. Entscheidend ist der Vergleich: Was hast du befürchtet, und was ist passiert?",source:"Slater, Pertaub & Steed 1999; Craske u. a. 2014; Skala 0–10 nach Wolpe 1969"},Ml=[{title:"Neurowissenschaft",items:[{who:"Balban, Spiegel, Huberman u. a. (2023)",what:"Zyklisches Seufzen: 5 Minuten täglich hoben die Stimmung stärker als Achtsamkeitsmeditation und senkten die Atemfrequenz in Ruhe. Cell Reports Medicine.",url:"https://doi.org/10.1016/j.xcrm.2022.100895"},{who:"Goldin & Gross (2010)",what:"Achtsamkeitstraining bei sozialer Angst: weniger Angst, besseres Selbstbild, ruhigere Amygdala bei negativen Gedanken über sich selbst. Emotion.",url:"https://pubmed.ncbi.nlm.nih.gov/20141305/"}]},{title:"Psychologie & Psychotherapie",items:[{who:"Clark & Wells (1995)",what:"Kognitives Modell sozialer Angst: Selbstbeobachtung und Sicherheitsverhalten halten die Angst aufrecht. Behandlung mit Video-Feedback, Fokus nach außen und Verhaltensexperimenten.",url:"https://www.sciencedirect.com/science/article/pii/S1077722916300232"},{who:"Wells: Attention Training Technique",what:"Übersichtsarbeit zur Wirksamkeit des Aufmerksamkeitstrainings (Knowles, Foden, El-Deredy & Wells).",url:"https://pubmed.ncbi.nlm.nih.gov/27129094/"},{who:"Eysenck, Derakshan, Santos & Calvo (2007)",what:"Attentional Control Theory: Angst bindet Kapazität im Arbeitsgedächtnis. Emotion.",url:"https://pubmed.ncbi.nlm.nih.gov/17516812/"},{who:"Brooks (2014)",what:"„Ich bin aufgeregt“ statt „Ich bin ruhig“: bessere Leistung beim Singen, Reden und Rechnen. Journal of Experimental Psychology: General.",url:"https://www.hbs.edu/faculty/Pages/item.aspx?num=45869"},{who:"Gollwitzer (1999)",what:"Wenn-Dann-Pläne helfen, Vorsätze im entscheidenden Moment umzusetzen. American Psychologist.",url:"https://www.socmot.uni-konstanz.de/publications/implementation-intentions-strong-effects-simple-plans"},{who:"Craske u. a. (2014)",what:"Exposition wirkt über verletzte Erwartungen: Je größer der Unterschied zwischen Befürchtung und Wirklichkeit, desto mehr lernt das Gehirn. Behaviour Research and Therapy.",url:"https://nationalsocialanxietycenter.com/research-summaries/inhibitory-learning-in-exposure-therapy-for-social-anxiety-and-other-anxiety-related-disorders/"},{who:"Slater, Pertaub & Steed (1999)",what:"Menschen reagieren auf ein freundliches oder ablehnendes Publikum, selbst wenn es rein virtuell ist.",url:"https://www.baillement.com/dossier/slater.public.speaking.pdf"},{who:"Wolpe (1969)",what:"Die Skala von 0 bis 10 für erlebte Belastung (SUDS), Standard in der Expositionstherapie.",url:"https://en.wikipedia.org/wiki/Subjective_units_of_distress_scale"},{who:"Bandura (1977)",what:"Selbstwirksamkeit: Gemeisterte Erfahrungen stärken das Zutrauen am meisten. Psychological Review.",url:"https://longevity.stanford.edu/self-efficacy-toward-a-unifying-theory-of-behavior-change/"}]},{title:"Sprache & Stimme",items:[{who:"Erickson, Lind, Johnson & O’Barr (1978)",what:"Zögerlaute, Weichmacher und Frage-Betonung senken die Glaubwürdigkeit von Sprechern.",url:"https://www.sciencedirect.com/science/article/abs/pii/002210317890015X"},{who:"Frontiers in Communication (2020)",what:"Stimmliches Charisma hängt vor allem an Tonhöhe und ihrer Variation, am Tempo und an der Lautstärke.",url:"https://www.frontiersin.org/journals/communication/articles/10.3389/fcomm.2020.611555/full"},{who:"Antonakis, Fenley & Liechti (2011)",what:"Kann man Charisma lernen? Zwei Trainingsstudien. Academy of Management Learning & Education.",url:"https://doi.org/10.5465/amle.2010.0012"},{who:"Titze (2006)",what:"Stimmtraining mit halb geschlossenem Vokaltrakt, zum Beispiel Summen. Journal of Speech, Language, and Hearing Research.",url:"https://pubs.asha.org/doi/full/10.1044/1092-4388(2006/035)"}]},{title:"Praxis",items:[{who:"Chris Voss, früher FBI-Verhandler",what:"Die „Late-Night-FM-DJ“-Stimme: tief, langsam, warm, mit fallenden Satzenden.",url:"https://www.cnbc.com/2020/01/07/ex-fbi-negotiator-chris-voss-how-to-negotiate.html"},{who:"Sinatra über Tommy Dorsey",what:"Lange Phrasen durch Atemkontrolle, abgeschaut beim Posaunisten Tommy Dorsey.",url:"https://www.jerryjazzmusician.com/great-encounters-21-the-influence-of-tommy-dorsey-on-frank-sinatra/"},{who:"Sinatra: „The written word is first“",what:"Erst den Text verstehen, dann Betonung und Timing wählen, oft minimal hinter dem Takt.",url:"https://elsewhere.co.nz/essentialelsewhere/2827/frank-sinatra-in-the-wee-small-hours-1955"},{who:"Sinatra im Radio",what:"Auf frühen Aufnahmen geht ihm hörbar die Luft aus. Danach werden seine Phrasen deutlich länger.",url:"https://jazzhistoryonline.com/frank-sinatra-radio/"}]},{title:"Mut & Selbstvertrauen",items:[{who:"Gilovich, Medvec & Savitsky (2000)",what:"Spotlight-Effekt: Wir überschätzen, wie sehr andere auf unser Aussehen und unsere Fehler achten. Journal of Personality and Social Psychology.",url:"https://scholar.google.com/scholar?q=Gilovich+Medvec+Savitsky+2000+spotlight+effect+social+judgment"},{who:"Savitsky & Gilovich (2003)",what:"Illusion der Durchschaubarkeit: Wer weiß, dass man Nervosität kaum sieht, hält bessere Reden. Journal of Experimental Social Psychology.",url:"https://scholar.google.com/scholar?q=Savitsky+Gilovich+2003+illusion+of+transparency+alleviation+of+speech+anxiety"},{who:"Boothby, Cooney, Sandstrom & Clark (2018)",what:"Sympathie-Lücke: Nach Gesprächen unterschätzen wir, wie sehr uns andere mögen. Psychological Science.",url:"https://scholar.google.com/scholar?q=Boothby+Cooney+Sandstrom+Clark+2018+liking+gap"},{who:"Epley & Schroeder (2014)",what:"Gespräche mit Fremden sind angenehmer, als Menschen erwarten. Journal of Experimental Psychology: General.",url:"https://scholar.google.com/scholar?q=Epley+Schroeder+2014+mistakenly+seeking+solitude"},{who:"Huang, Yeomans, Brooks, Minson & Gino (2017)",what:"Wer mehr Fragen stellt, besonders Nachfragen, wird mehr gemocht. Journal of Personality and Social Psychology.",url:"https://scholar.google.com/scholar?q=Huang+Yeomans+Brooks+Minson+Gino+2017+it+doesnt+hurt+to+ask"},{who:"Kross u. a. (2014)",what:"Selbstgespräch mit eigenem Namen und in der Du-Form senkt Angst vor Reden. Journal of Personality and Social Psychology.",url:"https://scholar.google.com/scholar?q=Kross+2014+self-talk+as+a+regulatory+mechanism+how+you+do+it+matters"},{who:"Ramirez & Beilock (2011)",what:"Sorgen vor einer Prüfung aufschreiben verbessert die Leistung. Science.",url:"https://scholar.google.com/scholar?q=Ramirez+Beilock+2011+writing+about+testing+worries+boosts+exam+performance"},{who:"Wells u. a. (1995)",what:"Wer Sicherheitsverhalten weglässt, verliert mehr Angst als bei Übung mit Krücken. Behavior Therapy.",url:"https://scholar.google.com/scholar?q=Wells+Clark+Salkovskis+1995+social+phobia+in-situation+safety+behaviors"},{who:"Masuda, Hayes, Sackett & Twohig (2004)",what:"Schnelles Wiederholen eines Wortes nimmt negativen Gedanken die Glaubwürdigkeit. Behaviour Research and Therapy.",url:"https://scholar.google.com/scholar?q=Masuda+Hayes+Sackett+Twohig+2004+cognitive+defusion+word+repetition"},{who:"Breines & Chen (2012)",what:"Selbstmitgefühl nach Fehlern steigert die Motivation, sich zu verbessern. Personality and Social Psychology Bulletin.",url:"https://scholar.google.com/scholar?q=Breines+Chen+2012+self-compassion+increases+self-improvement+motivation"},{who:"Creswell u. a. (2005)",what:"Über eigene Werte schreiben dämpft die körperliche Stressreaktion. Psychological Science.",url:"https://scholar.google.com/scholar?q=Creswell+2005+affirmation+of+personal+values+buffers+neuroendocrine+stress+responses"},{who:"Cuddy, Schultz & Fosse (2018); Ranehill u. a. (2015)",what:"Haltung wirkt aufs Gefühl von Stärke, behauptete Hormon-Effekte ließen sich nicht bestätigen.",url:"https://scholar.google.com/scholar?q=Cuddy+Schultz+Fosse+2018+p-curving+postural+feedback"},{who:"Bortfeld u. a. (2001)",what:"Etwa sechs Unebenheiten pro hundert Wörter sind im normalen Gespräch üblich. Language and Speech.",url:"https://scholar.google.com/scholar?q=Bortfeld+2001+disfluency+rates+in+conversation"},{who:"Hofmann & Otto (2008); Padesky (1994)",what:"Gedanken prüfen und ein Positiv-Tagebuch: Bausteine der kognitiven Verhaltenstherapie.",url:"https://scholar.google.com/scholar?q=Hofmann+Otto+2008+cognitive+behavioral+therapy+for+social+anxiety+disorder"},{who:"Lara (2010); Ben Simon u. a. (2020)",what:"Viel Koffein verstärkt Unruhe, Schlafmangel macht deutlich ängstlicher.",url:"https://scholar.google.com/scholar?q=Ben+Simon+2020+overanxious+and+underslept"}]}];b();b();var Sg=["Angst","Selbstvertrauen","Gespräche"],yl=[{id:"spotlight",cat:"Angst",title:"Spotlight-Check",minutes:2,intro:"Du überschätzt, wie sehr andere auf deine Fehler achten. Prüf es nach.",steps:["Denk an einen Moment, in dem du dich versprochen hast.","Schätz: Wie viele Leute haben es wirklich bemerkt?","Halbier diese Zahl. Das kommt der Wirklichkeit näher."],rating:{label:"Wie peinlich fühlt es sich jetzt an?",low:"gar nicht",high:"sehr"},why:"Studierende trugen ein peinliches T-Shirt in einen Raum voller Leute. Sie schätzten, die Hälfte würde es bemerken. In Wahrheit war es etwa ein Viertel. Wir fühlen uns viel mehr im Rampenlicht, als wir es sind.",source:"Gilovich, Medvec & Savitsky 2000: Spotlight-Effekt"},{id:"transparency",cat:"Angst",title:"Unsichtbare Nervosität",minutes:2,intro:"Deine Aufregung fühlt sich riesig an. Von außen sieht man kaum etwas.",steps:["Spür kurz hin, wo die Aufregung im Körper sitzt.","Sag laut: „Meine Nervosität fühlt sich groß an, aber andere sehen kaum etwas davon.“","Dann erzähl 30 Sekunden lang, wie dein Tag war."],control:{kind:"speak",seconds:30},why:"Redner, denen man vorher erklärte, dass man Nervosität von außen kaum sieht, hielten bessere Reden, fühlten sich wohler und wirkten auf Zuhörer gelassener.",source:"Savitsky & Gilovich 2003: Illusion der Durchschaubarkeit"},{id:"worry-write",cat:"Angst",title:"Sorgen aufschreiben",minutes:5,intro:"Vor einem wichtigen Gespräch: Schreib alle Sorgen raus, damit der Kopf frei wird.",steps:["Stell den Timer und schreib alles auf, was dich am Gespräch beunruhigt.","Nicht schön, nicht ordentlich. Einfach raus damit.","Danach Handy weg, einmal ausatmen und los."],inputs:[{label:"Was befürchtest du?",placeholder:"Ich habe Angst, dass …"}],control:{kind:"timer",seconds:300,label:"Schreib alles raus"},why:"Schüler und Studierende, die vor einer Prüfung 10 Minuten lang ihre Sorgen aufschrieben, schnitten besser ab. Besonders die Ängstlichen. Die Sorgen belegen dann weniger Platz im Arbeitsgedächtnis.",source:"Ramirez & Beilock 2011, Science"},{id:"three-outcomes",cat:"Angst",title:"Drei Ausgänge",minutes:3,intro:"Angst zeigt dir nur den schlimmsten Film. Schau dir alle drei an.",steps:["Schreib auf, was im schlimmsten Fall passiert.","Dann den besten Fall.","Dann den wahrscheinlichsten Fall, ehrlich und nüchtern.","Zum Schluss: Wenn das Schlimmste passiert, was würdest du dann tun?"],inputs:[{label:"Schlimmster Fall",placeholder:"Ich bleibe hängen und alle lachen …"},{label:"Bester Fall",placeholder:"Ich erzähle es locker und alle hören zu …"},{label:"Wahrscheinlichster Fall",placeholder:"Ich stocke kurz, mache weiter, keiner achtet darauf …"},{label:"Wenn das Schlimmste passiert, tue ich …",placeholder:"kurz lachen, ausatmen, den Satz nochmal sagen …"}],why:"Ein Kernstück der kognitiven Verhaltenstherapie bei sozialer Angst: Katastrophen-Gedanken werden geprüft statt geglaubt. Meist ist der wahrscheinliche Ausgang viel harmloser, und selbst der schlimme ist zu bewältigen.",source:"Kognitive Verhaltenstherapie, z. B. Hofmann & Otto 2008"},{id:"safety",cat:"Angst",title:"Krücken weglassen",minutes:2,intro:"Kleine Tricks, die sich sicher anfühlen, halten die Angst am Leben. Lass heute einen weg.",steps:["Such dir aus der Liste aus, was du oft machst.","Nimm dir vor, genau das im nächsten Gespräch wegzulassen.","Beobachte, was dann wirklich passiert."],chips:{label:"Was machst du oft?",options:["Blick vermeiden","Schneller reden, um fertig zu werden","Sätze vorher im Kopf proben","Leiser sprechen","Gespräch schnell beenden","Lieber nichts sagen","Mich sofort entschuldigen","Hände verstecken"]},why:"Menschen mit sozialer Angst, die ihr Sicherheitsverhalten bewusst wegließen, hatten danach weniger Angst und glaubten weniger an ihre Befürchtungen als bei gleicher Übung mit Krücken. Erst ohne Krücke erlebt das Gehirn: Es geht auch so.",source:"Wells u. a. 1995; Clark & Wells 1995"},{id:"mistake",cat:"Angst",title:"Ein Fehler mit Absicht",minutes:2,intro:"Mach heute einen kleinen Fehler mit Absicht und schau, was wirklich passiert.",steps:["Schreib vorher auf, was du befürchtest.","Bau heute in ein Gespräch einen kleinen Stolperer ein, z. B.: „Ich nehme einen … äh, einen Kaffee.“","Danach vergleichen: Was ist wirklich passiert? Trag es ins Erfolgs-Tagebuch ein."],inputs:[{label:"Was wird passieren, glaubst du?",placeholder:"Die Person schaut komisch, lacht mich aus …"}],rating:{label:"Wie sicher bist du, dass es schlimm wird?",low:"gar nicht",high:"ganz sicher"},why:"In der kognitiven Therapie sozialer Angst testen Patienten ihre Befürchtungen mit absichtlichen kleinen Fehlern. Fast immer reagiert die Umwelt viel gelassener als erwartet. Genau dieser Unterschied baut die Angst ab.",source:"Clark & Wells 1995: Verhaltensexperimente; Craske u. a. 2014"},{id:"defusion",cat:"Angst",title:"Gedanken entschärfen",minutes:1,intro:"Ein Angstgedanke verliert seine Macht, wenn du ihn von außen anschaust.",steps:["Nimm deinen lautesten Angstgedanken, z. B. „Ich blamiere mich.“","Sag laut: „Ich habe den Gedanken, dass ich mich blamiere.“","Nimm ein Wort daraus, z. B. „blamieren“, und sag es 30 Sekunden lang schnell hintereinander."],control:{kind:"timer",seconds:30,label:"Wort schnell wiederholen"},why:"Nach etwa 30 Sekunden schnellem Wiederholen wirkten negative Gedanken über sich selbst deutlich weniger glaubwürdig und unangenehm. Das Wort wird zum bloßen Klang.",source:"Masuda, Hayes u. a. 2004; Akzeptanz- und Commitment-Therapie"},{id:"distance",cat:"Selbstvertrauen",title:"Mit dir wie mit einem Freund",minutes:2,intro:"Sprich vor einem Gespräch mit dir in der Du-Form und mit deinem Namen.",steps:["Sag deinen Namen und sprich dich mit „du“ an.","Zum Beispiel: „[Name], du bist vorbereitet. Du sprichst langsam. Du schaffst das, weil …“","Eine Minute, laut oder leise."],control:{kind:"speak",seconds:60},why:"Vor einer Rede waren Menschen, die mit sich in der Du-Form und mit eigenem Namen sprachen, weniger ängstlich, sprachen besser und grübelten danach weniger als die, die „ich“ sagten. Der Abstand macht ruhiger.",source:"Kross u. a. 2014: Selbstgespräch mit Abstand"},{id:"compassion",cat:"Selbstvertrauen",title:"Freundlich zu dir",minutes:1,intro:"Nach einem Patzer: drei Sätze, die dich aufrichten statt runtermachen.",steps:["Leg eine Hand auf die Brust.","„Das war gerade unangenehm.“","„Das kennt jeder Mensch.“","„Ich darf freundlich zu mir sein und es nochmal versuchen.“"],control:{kind:"timer",seconds:60,label:"Ruhig atmen, die drei Sätze sagen"},why:"Wer nach einem Fehler mitfühlend mit sich umging, war motivierter, es besser zu machen, und übte länger als wer sich nur selbst aufbaute oder kritisierte.",source:"Breines & Chen 2012; Neff 2003"},{id:"values",cat:"Selbstvertrauen",title:"Werte-Kompass",minutes:3,intro:"Vor einer stressigen Situation: Erinnere dich, was dir wirklich wichtig ist.",steps:["Wähle den Wert, der dir am wichtigsten ist.","Schreib zwei Sätze, warum er dir wichtig ist und wann du ihn zuletzt gelebt hast.","Ein Versprecher ändert nichts daran, wer du bist."],chips:{label:"Was ist dir am wichtigsten?",options:["Familie","Freundschaft","Humor","Ehrlichkeit","Hilfsbereitschaft","Fleiß","Freiheit","Kreativität","Glaube"]},inputs:[{label:"Warum ist dir das wichtig?",placeholder:"Weil …"}],why:"Wer vor einer Stressprobe mit Rede kurz über seine wichtigsten Werte schrieb, zeigte eine deutlich geringere Stressreaktion des Körpers (Cortisol). Der Selbstwert hängt dann weniger an dieser einen Situation.",source:"Creswell u. a. 2005: Selbstbestätigung durch Werte"},{id:"posture",cat:"Selbstvertrauen",title:"Aufrecht ankommen",minutes:1,intro:"Eine Minute aufrechte Haltung vor einem Gespräch.",steps:["Stell dich hin, Füße hüftbreit, Schultern locker nach hinten.","Kinn waagerecht, Blick geradeaus, tief in den Bauch atmen.","Eine Minute halten. Dann mit dieser Haltung ins Gespräch."],control:{kind:"timer",seconds:60,label:"Aufrecht stehen, ruhig atmen"},why:"Eine aufrechte, offene Haltung kann das Gefühl von Stärke etwas heben. Ehrlich gesagt: Die früher behaupteten Hormon-Effekte ließen sich nicht bestätigen. Es ist ein kleiner Schub fürs Gefühl, kein Zaubertrick.",source:"Cuddy, Schultz & Fosse 2018; Ranehill u. a. 2015"},{id:"evidence",cat:"Selbstvertrauen",title:"Beweise sammeln",minutes:3,intro:"Angst merkt sich jeden Patzer. Sammle bewusst die Momente, die gut liefen.",steps:["Denk an drei Momente, in denen du gut gesprochen hast, egal wie klein.","Schreib sie auf. Sie landen in deinem Erfolgs-Tagebuch.","Lies sie vor dem nächsten schwierigen Gespräch."],inputs:[{label:"Moment 1",placeholder:"Ich habe einem Kunden etwas erklärt und …"},{label:"Moment 2",placeholder:"Ich habe einen Witz erzählt …"},{label:"Moment 3",placeholder:"Ich habe nachgefragt, obwohl …"}],saveToWins:!0,why:"In der Therapie gegen negative Selbstbilder führen Patienten ein „Positiv-Tagebuch“, weil das Gehirn Gegenbeweise sonst übersieht. Gemeisterte Erfahrungen sind die stärkste Quelle von Selbstvertrauen.",source:"Padesky 1994: Positiv-Tagebuch; Bandura 1977"},{id:"questions",cat:"Gespräche",title:"Fragen statt Druck",minutes:1,intro:"Du musst nicht glänzen. Stell eine Frage und dann eine Nachfrage.",steps:["Im nächsten Gespräch: eine echte Frage stellen.","Auf die Antwort eine Nachfrage: „Wie meinst du das?“, „Und dann?“, „Was hat dir daran gefallen?“","Zuhören. Du nimmst dir damit auch den Druck, selbst viel reden zu müssen."],why:"In Chat- und Speed-Dating-Studien wurden Menschen, die mehr Fragen stellten, deutlich mehr gemocht. Besonders Nachfragen wirken: Sie zeigen, dass man zuhört.",source:"Huang, Yeomans, Brooks u. a. 2017"},{id:"liking-gap",cat:"Gespräche",title:"Sympathie-Lücke",minutes:1,intro:"Nach einem Gespräch denkst du oft: „Die fand mich bestimmt komisch.“ Meist stimmt das nicht.",steps:["Denk an dein letztes Gespräch.","Schätz: Wie sehr mochte dich die Person?","Rechne ein bis zwei Punkte drauf. So unterschätzen sich die meisten."],rating:{label:"Wie sehr mochte dich die Person?",low:"gar nicht",high:"sehr"},why:"Nach Gesprächen mit Fremden unterschätzten Menschen regelmäßig, wie sehr ihr Gegenüber sie mochte und das Gespräch genoss. Das galt für kurze wie für lange Gespräche. Bei Mitbewohnern hielt die Lücke sogar monatelang an.",source:"Boothby, Cooney, Sandstrom & Clark 2018"},{id:"strangers",cat:"Gespräche",title:"Fremde sind netter",minutes:2,intro:"Schätz vorher, wie ein kurzes Gespräch mit einem Fremden wird. Dann probier es aus.",steps:["Schätz: Wie angenehm wird ein kurzes Gespräch mit einem Fremden?","Sprich heute jemanden kurz an: Weg, Wetter, ein Kompliment.","Danach vergleichen. Meistens ist es schöner als gedacht."],rating:{label:"Wie angenehm wird es?",low:"unangenehm",high:"sehr angenehm"},why:"Pendler, die in Bus oder Bahn einen Fremden ansprachen, hatten eine angenehmere Fahrt als die, die allein saßen. Vorher hatten sie genau das Gegenteil erwartet.",source:"Epley & Schroeder 2014"}],Sn=[{id:"speed",title:"Warum du unter Stress schneller redest",text:"Bei Stress schaltet der Körper auf Alarm: Puls hoch, Atem flach, alles soll schnell vorbei sein. Angst belegt außerdem einen Teil des Arbeitsgedächtnisses, der dann fürs Formulieren fehlt. Deshalb holpert der Satzanfang.",tip:"Erst ausatmen, dann sprechen. Pausen geben dem Kopf die Zeit, die die Angst ihm nimmt.",source:"Eysenck u. a. 2007"},{id:"circle",title:"Der Teufelskreis im Kopf",text:"Wer Angst hat, sich zu blamieren, beobachtet sich beim Sprechen selbst: Wie klinge ich? Sieht man es mir an? Diese Selbstbeobachtung frisst Aufmerksamkeit, man spricht schlechter, und das bestätigt die Angst.",tip:"Aufmerksamkeit nach außen: auf das Gesicht, die Worte, ein Detail im Raum.",source:"Clark & Wells 1995"},{id:"wander",title:"Wenn die Gedanken woanders sind",text:"Abschweifen ist normal, das Gehirn tut es von selbst. Entscheidend ist, wie schnell du zurückkommst. Genau das trainieren Aufmerksamkeitsübungen und Meditation: das Zurückholen, nicht das Nie-Abschweifen.",tip:"Merkst du es im Gespräch: kurz ausatmen, auf ein Detail am Gegenüber schauen, weiterreden.",source:"Wells: Aufmerksamkeitstraining; Goldin & Gross 2010"},{id:"spotlight",title:"Der Spotlight-Effekt",text:"Wir glauben, alle sehen unsere Fehler. In einem Versuch schätzten Studierende mit einem peinlichen T-Shirt, die Hälfte der Leute würde es bemerken. Tatsächlich war es etwa ein Viertel.",tip:"Teil deine Schätzung, wie viele etwas bemerkt haben, durch zwei.",source:"Gilovich, Medvec & Savitsky 2000"},{id:"transparency",title:"Man sieht dir weniger an, als du denkst",text:"Die eigene Nervosität fühlt sich riesig an, von außen sieht man sie kaum. Fachleute nennen das die Illusion der Durchschaubarkeit. Redner, die das vorher wussten, hielten bessere Reden.",tip:"Sag dir vor dem Sprechen: „Es fühlt sich groß an, aber man sieht es kaum.“",source:"Savitsky & Gilovich 2003"},{id:"liking-gap",title:"Andere mögen dich mehr, als du glaubst",text:"Nach Gesprächen mit Fremden unterschätzen fast alle, wie sehr ihr Gegenüber sie mochte. Der innere Kritiker bewertet viel strenger als die anderen.",tip:"Nach einem Gespräch: deinen Eindruck um ein bis zwei Punkte nach oben korrigieren.",source:"Boothby u. a. 2018"},{id:"strangers",title:"Fremde sind netter, als du denkst",text:"Pendler, die im Zug einen Fremden ansprachen, hatten eine angenehmere Fahrt als die, die allein saßen. Vorher hatten sie das Gegenteil erwartet.",tip:"Kleine Gespräche mit Fremden sind ein ideales Übungsfeld: wenig Risiko, oft ein guter Moment.",source:"Epley & Schroeder 2014"},{id:"disfluency",title:"Fehler gehören zum Sprechen",text:"Auch im ganz normalen Gespräch hat jeder Unebenheiten: „äh“, Wiederholungen, Neustarts. Gezählt wurden etwa sechs pro hundert Wörter. Ein Versprecher ist also normal, kein Zeichen von Schwäche.",tip:"Wenn du hängst: Satz einfach nochmal sagen, ohne Entschuldigung.",source:"Bortfeld u. a. 2001"},{id:"avoid",title:"Vermeiden füttert die Angst",text:"Jedes Mal, wenn du ausweichst, lernt das Gehirn: „Gut, dass wir weg sind, das war gefährlich.“ Wer sich der Situation stellt und erlebt, dass es gut geht, lernt neu. Am stärksten, wenn es besser läuft als befürchtet.",tip:"Vorher kurz schätzen, wie schlimm es wird, nachher vergleichen. Genau dafür gibt es die Angst-Leiter.",source:"Craske u. a. 2014"},{id:"safety",title:"Die versteckten Krücken",text:"Schnell reden, Blick vermeiden, Sätze vorher proben: Das fühlt sich sicher an, hält die Angst aber am Leben. Denn so erlebst du nie, dass es auch ohne geht.",tip:"Lass immer nur eine Krücke auf einmal weg, nicht alle gleichzeitig.",source:"Wells u. a. 1995"},{id:"friends",title:"Warum es bei Freunden schwerer sein kann",text:"Wenn man in einer Runde einmal ausgelacht wurde, merkt sich das Gehirn: Diese Runde ist heikel. Fremde kennen diese Geschichte nicht, Freunde schon. Das alte Gefühl verschwindet nicht durch Nachdenken, sondern durch neue, gute Erfahrungen mit genau diesen Menschen.",tip:"Übe auch in der Freundesrunde, in kleinen Schritten: erst eine kurze Beobachtung, später eine Geschichte.",source:"Craske u. a. 2014: inhibitorisches Lernen"},{id:"reappraise",title:"Aufregung umdeuten statt unterdrücken",text:"Herzklopfen fühlt sich bei Angst und bei Vorfreude fast gleich an. Wer sich sagt „Ich bin aufgeregt“ statt „Ich bin ruhig“, schneidet beim Reden besser ab. Beruhigen klappt unter Druck schlecht, umdeuten klappt gut.",tip:"Vor dem Gespräch leise sagen: „Ich bin aufgeregt.“",source:"Brooks 2014"},{id:"mastery",title:"Selbstvertrauen kommt nach dem Tun",text:"Du musst dich nicht erst sicher fühlen, um anzufangen. Die stärkste Quelle von Selbstvertrauen sind gemeisterte Erfahrungen, auch ganz kleine. Das Gefühl folgt dem Handeln.",tip:"Jeden Tag eine kleine Mission. Und sie ins Erfolgs-Tagebuch schreiben.",source:"Bandura 1977"},{id:"thoughts",title:"Gedanken sind keine Tatsachen",text:"„Die halten mich für komisch“ ist eine Vermutung, kein Beweis. Angstgedanken zu prüfen statt ihnen sofort zu glauben, ist einer der wirksamsten Bausteine der Therapie gegen soziale Angst.",tip:"Frag dich: Was spricht dafür, was dagegen? Was würde ich einem Freund sagen? Dafür gibt es den Gedanken-Check.",source:"Hofmann & Otto 2008"},{id:"compassion",title:"Freundlich zu dir statt streng",text:"Viele glauben, Strenge mit sich selbst mache besser. Das Gegenteil stimmt: Wer nach einem Fehler mitfühlend mit sich spricht, ist motivierter, es nochmal zu versuchen.",tip:"Sprich mit dir so, wie du mit einem guten Freund sprechen würdest.",source:"Breines & Chen 2012"},{id:"questions",title:"Fragen machen sympathisch",text:"Menschen, die mehr Fragen stellen, vor allem Nachfragen, werden mehr gemocht. Du musst also nicht witzig oder schlau sein, nur interessiert.",tip:"Hängst du im Gespräch, stell eine Frage. Das nimmt den Druck und hält das Gespräch am Laufen.",source:"Huang u. a. 2017"},{id:"distance",title:"Mit dir reden wie mit einem Freund",text:"Selbstgespräch in der Du-Form und mit eigenem Namen schafft Abstand zu den Gefühlen. Vor einer Rede waren Menschen damit weniger ängstlich und sprachen besser.",tip:"Statt „Ich schaffe das nicht“: „[Name], du schaffst das, du hast es schon oft gemacht.“",source:"Kross u. a. 2014"},{id:"worry",title:"Sorgen aufschreiben macht den Kopf frei",text:"Wer vor einer Prüfung zehn Minuten seine Sorgen aufschrieb, schnitt besser ab, besonders ängstliche Menschen. Was auf dem Papier steht, muss der Kopf nicht mehr festhalten.",tip:"Vor einem wichtigen Gespräch fünf Minuten Sorgen rausschreiben. Die Übung findest du unter „Angst“.",source:"Ramirez & Beilock 2011"},{id:"values",title:"Werte geben Halt",text:"Wer vor einer Stressprobe kurz über seine wichtigsten Werte schreibt, zeigt weniger körperlichen Stress. Ein Gespräch ist dann nicht mehr ein Urteil über dich als Ganzes.",tip:"Erinnere dich vor schwierigen Momenten an das, was dir wirklich wichtig ist.",source:"Creswell u. a. 2005"},{id:"body",title:"Kaffee, Schlaf und Nervosität",text:"Viel Koffein kann Herzklopfen und innere Unruhe verstärken, und wenig Schlaf macht das Gehirn deutlich empfindlicher für Angst. Wenn du an solchen Tagen schneller sprichst, ist das kein Zufall und kein Rückschritt.",tip:"Vor wichtigen Gesprächen lieber ein Kaffee weniger, und am Abend davor genug Schlaf.",source:"Lara 2010; Ben Simon u. a. 2020"}],jg=[{id:"p01",text:"Jemanden auf der Straße nach der Uhrzeit fragen",fear:2},{id:"p02",text:"An der Kasse einen ganzen Satz sagen, nicht nur „Danke“",fear:2},{id:"p03",text:"Im Laden nach einer Empfehlung fragen",fear:3},{id:"p04",text:"Einer fremden Person ein kleines Kompliment machen",fear:4},{id:"p05",text:"Irgendwo anrufen statt eine Nachricht zu schreiben",fear:4},{id:"p06",text:"Mit einem Fremden drei Sätze Smalltalk führen",fear:5},{id:"p07",text:"Einem Freund eine Sprachnachricht von 30 Sekunden schicken",fear:4},{id:"p08",text:"Unter Freunden eine kleine Beobachtung erzählen",fear:5},{id:"p09",text:"Unter Freunden bewusst langsam sprechen, auch wenn jemand drängelt",fear:6},{id:"p10",text:"In der Freundesrunde eine Geschichte bis zum Ende erzählen",fear:7},{id:"p11",text:"In einer Gruppe von fünf oder mehr deine Meinung sagen",fear:7},{id:"p12",text:"In der Runde einen Witz erzählen",fear:8},{id:"p13",text:"Bei einer Feier einen kurzen Toast halten",fear:9}],Wg=["Andere achten viel weniger auf mich, als ich denke.","Man sieht meine Nervosität kaum.","Andere mögen mich meist mehr, als ich glaube.","Jeder hat beim Sprechen Unebenheiten, etwa sechs pro hundert Wörter.","Ein Versprecher ist kein Urteil über mich.","Ich muss nicht perfekt sein, nur echt.","Es ist schon oft gut gegangen."],Ag=["Die halten mich für komisch.","Ich bleibe bestimmt wieder hängen.","Alle merken, dass ich nervös bin.","Wenn ich mich verspreche, lachen sie.","Ich habe nichts Interessantes zu sagen."],zg=["Ich habe jemanden angesprochen.","Ich habe langsam gesprochen.","Ich habe einen Satz zu Ende gesagt, obwohl ich kurz hing.","Ich habe eine Nachfrage gestellt.","Ich habe unter Freunden etwas erzählt.","Ich habe mich nicht entschuldigt, sondern einfach weitergemacht."],jn=[{id:"rescue",title:"Retter-Sätze",intro:"Für den Moment, wenn du hängst oder den Faden verlierst. Ruhig sagen, dann weiter.",lines:["Moment, ich sortiere kurz meine Gedanken.","Lass mich das anders sagen.","Wo war ich? Ach ja …","Ich fang den Satz nochmal an.","Gute Frage, lass mich kurz überlegen.","Wie sag ich das am besten …","Ich habe gerade den Faden verloren, worüber sprachen wir?","Kurz gesagt: …","Das Wort fällt mir gerade nicht ein, du weißt, was ich meine.","Warte, das ist mir wichtig, ich sag es nochmal richtig."]},{id:"strangers",title:"Mit Fremden",intro:"Kurze, leichte Einstiege. Ein Satz plus eine Frage reicht.",lines:["Entschuldigung, wissen Sie, wie spät es ist?","Ist hier noch frei?","Schönes Wetter heute. Haben Sie noch was Schönes vor?","Coole Jacke, wo gibt es die?","Kennen Sie sich hier aus? Ich suche …","Können Sie mir etwas empfehlen?","Ist das gut? Ich überlege, es auch zu nehmen.","Wie heißt Ihr Hund? Der ist ja süß.","Ganz schön voll heute, oder?","Wartet ihr auch auf den Bus nach …?","Darf ich kurz fragen, wo Sie das gekauft haben?","Sie sehen aus, als kennen Sie sich aus: Welche Richtung zum Bahnhof?","Ich bin neu hier, was kann man in der Gegend machen?","Was ist Ihr Lieblingsgericht hier?","Danke, das war wirklich nett von Ihnen."]},{id:"friends",title:"Unter Freunden",intro:"Einstiege, mit denen du selbst ein Thema setzt.",lines:["Rate mal, was mir heute passiert ist.","Ich hab was Lustiges gesehen, wartet …","Was war euer Highlight diese Woche?","Ich brauche mal eure Meinung zu was.","Kennt ihr das, wenn …?","Ich hab mir überlegt, wir könnten mal …","Habt ihr schon von … gehört?","Weißt du noch, als wir …?","Ich hab einen neuen Song entdeckt, hört mal.","Was würdet ihr machen, wenn …?","Heute ist mir was Komisches aufgefallen.","Ehrlich gesagt war meine Woche ziemlich …","Wer hat Lust, am Wochenende …?","Ich muss euch was erzählen.","Was ist das Beste, was ihr in letzter Zeit gegessen habt?"]},{id:"follow-up",title:"Nachfragen",intro:"Halten jedes Gespräch am Laufen und nehmen dir den Druck, selbst viel zu reden.",lines:["Wie meinst du das?","Und wie ging es dann weiter?","Was hat dir daran gefallen?","Wie bist du darauf gekommen?","Echt? Erzähl mehr.","Wie war das für dich?","Was war das Schwierigste daran?","Und was hast du dann gemacht?","Würdest du das nochmal machen?","Was hat dich am meisten überrascht?","Seit wann machst du das
