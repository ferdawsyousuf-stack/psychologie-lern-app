eine *Mitte*, / die *überrascht*, / und ein *Ende*, / das man *mitnimmt*.","Auf dem *Markt* ruft ein Händler. / Seine Stimme ist *tief* / und völlig *entspannt*. / Er muss nicht *schreien*, / denn er *weiß*, / was er *verkauft*.","Gestern habe ich *Mut* gebraucht. / Mein Herz hat *geklopft*, / meine Hände waren *kalt*. / Ich habe *trotzdem* gesprochen. / Und weißt du *was*? / Die Welt ist nicht *untergegangen*.","Am *Bahnhof* warten viele Menschen. / Jeder hat ein *Ziel*, / jeder eine *Geschichte*. / Ich stelle mir *vor*, / wohin sie *fahren* / und wer *wartet*, / wenn sie *ankommen*.","Musik lebt von *Pausen*. / Ohne *Stille* / gäbe es keinen *Rhythmus*. / Beim *Sprechen* ist es genauso: / Die Pause *trägt*, / was danach *kommt*.","Mein *Freund* erzählt Witze / immer viel zu *schnell*. / Er lacht schon *vorher*, / und keiner versteht die *Pointe*. / Heute hat er es *langsam* versucht. / Zum ersten *Mal* / haben *alle* gelacht.","Im *Winter* wird es früh dunkel. / Wir zünden *Kerzen* an / und erzählen uns *Geschichten*. / Niemand schaut auf die *Uhr*. / Die *Zeit* gehört / heute *uns*.","Ein *Fremder* hat mich heute angelächelt, / einfach *so*. / Ich habe *zurückgelächelt*. / Für einen *Moment* / war der ganze *Stress* / ganz *klein*.","Das *Meer* von oben: / ein blaues *Tuch*, / auf dem kleine *Boote* liegen. / Von hier *oben* / wirken alle *Sorgen* / wie diese Boote: / *klein* / und weit *weg*.","Ein *Baum* wächst nicht in einer Nacht. / Jeder *Ring* im Holz / ist ein ganzes *Jahr*. / Auch meine *Stimme* wächst, / Ring für *Ring*, / Tag für *Tag*.","Sinatra sagte *sinngemäß*: / Der *Text* kommt zuerst. / Erst wenn man ihn *versteht*, / weiß man, / wo man *betont* / und wo man *leise* wird.","Heute koche ich für *Freunde*. / Es gibt *Pasta* / mit Tomaten und *Basilikum*. / Nichts *Kompliziertes*, / aber mit *Liebe* gemacht. / Am Ende zählt nicht das *Rezept*, / sondern der *Abend*.","Wer *zuhört*, / lernt mehr als *gedacht*. / Man hört *Worte*, / aber auch *Pausen*, / *Zögern* / und *Freude*. / Gutes Zuhören ist / die *leiseste* Form / von *Respekt*.","Im *Kino* wird es dunkel. / Das *Rascheln* hört auf. / Für zwei *Stunden* / bin ich in einer anderen *Welt*. / Danach gehe ich *langsam* nach Hause / und denke *nach*.","Auf dem *Balkon* wachsen Tomaten, / jeden Tag ein bisschen *mehr*. / Ich *gieße* sie, / ich *warte*, / und irgendwann / sind sie *rot*. / Geduld *schmeckt* / am Ende *süß*.","Ein *Gespräch* ist wie ein Tanz. / Einer *führt*, / der andere *folgt*, / dann *wechselt* es. / Niemand muss *perfekt* tanzen. / Es reicht, / im *Takt* zu bleiben.","Die *Sonne* geht unter / hinter den *Dächern*. / Der Himmel wird *orange*, / dann *rosa*, / dann *blau*. / Ich bleibe *stehen* / und *schaue*, / bis es *dunkel* ist.","Neue *Wege* machen nervös. / Das ist *normal*. / Der Körper sagt: / *Achtung*, / hier ist etwas *wichtig*. / Ich sage *danke* / und gehe den Weg *trotzdem*.","Am *Wochenende* fahre ich ans Wasser. / Ich nehme ein *Buch* mit, / eine *Decke* / und gar keinen *Plan*. / Manchmal / ist *nichts* zu tun / das *Beste*.","Ein guter *Witz* braucht Timing. / Zu *früh*, / und er verpufft. / Zu *spät*, / und er ist vorbei. / Genau im richtigen *Moment* / trifft er *mitten* ins Herz.","In der *Bibliothek* ist es still. / Man hört nur *Seiten*, / die *umgeblättert* werden. / Hier spricht *niemand* laut, / und trotzdem / erzählen tausend *Bücher* / gleichzeitig ihre *Geschichten*.","Ich stelle mir *vor*, / ich stehe auf einer *Bühne*. / Das Licht ist *warm*, / die Menschen *freundlich*. / Ich atme *aus* / und beginne / mit einem *Lächeln*.","Fahrradfahren hat mir mein *Vater* beigebracht. / Er ist *nebenher* gelaufen, / hat *festgehalten* / und irgendwann *losgelassen*. / Ich habe es erst *gemerkt*, / als ich schon *fuhr*.","Gute *Stimmen* sind nicht laut. / Sie sind *klar*. / Sie *wissen*, / was sie sagen wollen, / und lassen jedem *Wort* / seinen *Platz*.","Der *Hafen* am Morgen: / *Möwen*, / *Salz* in der Luft / und Fischer, / die ihre *Netze* flicken. / Jeder hier hat seinen *Rhythmus*, / und keiner *hetzt*.","Heute war ein *normaler* Tag. / Nichts *Besonderes*, / nichts *Schlimmes*. / Und *doch*: / ein gutes *Gespräch*, / ein warmes *Essen*, / ein *Lachen*. / Vielleicht sind normale Tage / die *besten*."],Fr=["Was hat dich heute überrascht?","Welcher Ort in deiner Stadt wird unterschätzt?","Was war das beste Essen, das du je hattest?","Welche Fähigkeit hättest du gern sofort?","Was macht einen guten Gastgeber aus?","Wohin würdest du morgen reisen, wenn alles bezahlt wäre?","Was hat dich diese Woche zum Lachen gebracht?","Welcher Song läuft gerade in deinem Kopf und warum?","Was würdest du einem Freund raten, der vor einem Gespräch nervös ist?","Was war dein Lieblingsspiel als Kind?","Welcher Film hat dich zuletzt berührt?","Was machst du an einem perfekten Sonntag?","Welche Jahreszeit magst du am liebsten und warum?","Wer hat dir etwas Wichtiges beigebracht?","Was würdest du mit einer freien Woche anfangen?","Welches Essen kannst du richtig gut kochen?","Was ist das Schönste an deinem Viertel?","Welche Erfindung findest du genial?","Was nervt dich im Alltag, und wie gehst du damit um?","Welches Tier wärst du gern für einen Tag?","Was war dein bester Urlaub?","Was bedeutet Freundschaft für dich?","Welche Gewohnheit tut dir richtig gut?","Was würdest du deinem 15-jährigen Ich sagen?","Welches Buch oder welche Serie empfiehlst du gerade?","Was ist dein Lieblingsgeräusch?","Wo fühlst du dich zu Hause?","Was hast du zuletzt zum ersten Mal gemacht?","Welcher Mensch inspiriert dich?","Was ist für dich ein guter Feierabend?","Welche Musik hörst du, wenn du gute Laune willst?","Was hast du dieses Jahr gelernt?","Wie sieht für dich ein perfektes Frühstück aus?","Was würdest du erfinden, wenn du könntest?","Was ist das Mutigste, das du je getan hast?","Welche Stadt möchtest du unbedingt einmal sehen?","Was macht einen guten Tag aus?","Erzähl von einem Moment, in dem du stolz auf dich warst.","Was magst du an deiner Arbeit?","Welcher Duft erinnert dich an früher?","Wie würdest du einem Touristen deine Stadt zeigen?","Was ist dein liebstes Ritual am Morgen?","Welche Sportart würdest du gern können?","Was ist das beste Geschenk, das du je bekommen hast?","Welcher Rat hat dir wirklich geholfen?","Was würdest du tun, wenn du einen Tag unsichtbar wärst?","Wofür bist du heute dankbar?","Welche kleine Sache macht dich sofort glücklich?","Was war dein peinlichster, aber lustigster Moment?","Wie stellst du dir dein Leben in fünf Jahren vor?","Welches Gericht aus einem anderen Land liebst du?","Wo denkst du am besten nach?","Welche Superkraft hättest du gern?","Was hast du von deinen Eltern gelernt?","Welches Wetter magst du am liebsten?","Was würdest du gern besser können?","Erzähl von einem Abend, den du nie vergisst.","Was macht für dich gute Musik aus?","Auf welche App könntest du sofort verzichten?","Was würdest du kochen, wenn Sinatra zu Besuch käme?"],ld=["Erzähl in drei Sätzen, was heute passiert ist.","Beschreib in drei Sätzen deinen Weg zur Arbeit.","Sag in drei Sätzen, was du an deinem besten Freund magst.","Erklär in drei Sätzen, wie man dein Lieblingsessen kocht.","Beschreib in drei Sätzen dein Zimmer.","Sag in drei Sätzen, was du am Wochenende vorhast.","Empfiehl in drei Sätzen einen Film.","Beschreib in drei Sätzen das Wetter von heute.","Erzähl in drei Sätzen von deinem letzten Urlaub.","Sag in drei Sätzen, warum du gern dort wohnst, wo du wohnst.","Beschreib in drei Sätzen einen Menschen, den du magst.","Erklär in drei Sätzen, wofür du dein Handy am meisten nutzt.","Sag in drei Sätzen, was dich glücklich macht.","Beschreib in drei Sätzen ein Foto, an das du dich gern erinnerst.","Erzähl in drei Sätzen, was du gestern Abend gemacht hast.","Sag in drei Sätzen, was du heute noch erledigen willst.","Beschreib in drei Sätzen deinen Lieblingsort.","Erklär in drei Sätzen eine Regel aus deinem Lieblingsspiel.","Sag in drei Sätzen, welche Musik du magst und s gut. Wir finden eine Lösung. Lass uns kurz durchatmen.","Ich verstehe dich. Erzähl mir in Ruhe, was passiert ist.","Kein Stress. Wir machen einen Schritt nach dem anderen.","Das klingt anstrengend. Ich bin da und höre zu.","Wir haben Zeit. Niemand muss sich beeilen.","Danke, dass du das sagst. Lass uns gemeinsam schauen.","Das schaffen wir. Ganz ruhig, eins nach dem anderen.","Ich nehme mir kurz Zeit und antworte dir dann.","Guten Abend. Schön, dass du da bist. Mach es dir bequem.","Lass uns kurz innehalten. Was ist dir jetzt am wichtigsten?","Das ist ein guter Punkt. Ich denke kurz darüber nach.","Du bist nicht allein damit. Wir klären das zusammen.","Ich habe dich gehört. Und ich nehme das ernst.","Erst atmen, dann sprechen. Wir haben alle Zeit der Welt.","Willkommen zurück. Wie war deine Woche?","Alles der Reihe nach. Fang einfach vorne an.","Ich bin mir sicher, dass wir einen Weg finden.","Das ist okay. Fehler passieren. Wir machen weiter.","Ruhig. Klar. Langsam. So klingt Vertrauen.","Danke für deine Geduld. Das bedeutet mir viel.","Schön, dich zu sehen. Wie geht es dir wirklich?","Ich höre dir zu. Nimm dir die Zeit, die du brauchst.","Das klingt nach einem langen Tag. Setz dich erst mal.","Wir müssen das nicht heute lösen. Morgen ist auch ein Tag.","Gute Nacht. Schlaf gut. Morgen wird ein guter Tag."],hd=["sss","fff","sch"],ud=["Augen zu, spür den Atem an der Nase.","Augen zu, spür, wie sich der Bauch hebt und senkt.","Augen zu, zähl die Ausatmer von 1 bis 10, dann von vorn.","Augen zu, spür den Atem im Brustkorb."],sd=["Blick nach außen: Welche Augenfarbe hat die Person?","Blick nach außen: Was hält die Person in der Hand?","Blick nach außen: Welche Farbe hat ihre Kleidung?","Blick nach außen: Wie klingt ihre Stimme gerade?","Blick nach außen: Was steht hinter ihr im Raum?","Blick nach außen: Lächelt sie gerade, oder ist sie konzentriert?","Blick nach außen: Welches Detail fällt dir an ihr zuerst auf?","Blick nach außen: Wie ist das Licht im Raum?","Blick nach außen: Was hat sie gerade als Letztes gesagt?","Blick nach außen: Welche drei Dinge siehst du um sie herum?"],Cr=(t,a)=>a.map(r=>({cat:t,text:r})),hn=[...Cr("Vorstellen",["Stell dich vor, als wärst du Gastgeber eines schönen Abends.","Stell dich in einer Minute vor: Name, was du magst, was dich ausmacht.","Stell dich vor, als würdest du heute einen neuen Job beginnen.","Stell dich einer Gruppe vor, die dich noch nicht kennt.","Stell dich vor, als wärst du Moderator einer Radiosendung.","Begrüß neue Nachbarn und erzähl kurz von deiner Straße.","Stell dein Lieblingshobby vor, als wäre es eine eigene Fernsehsendung.","Stell dich vor, als wärst du Kapitän eines Schiffs kurz vor der Abfahrt."]),...Cr("Toast",["Halte einen kurzen Toast auf einen guten Freund.","Halte einen Toast auf deine Familie.","Halte eine Geburtstagsrede für jemanden, den du magst.","Halte einen Toast auf das Wochenende.","Halte eine kurze Rede zum Abschied eines Kollegen.","Bedank dich vor allen Gästen bei jemandem, der dir geholfen hat.","Halte einen Toast auf das neue Jahr."]),...Cr("Überzeugen",["Überzeug uns in einer Minute von deinem Lieblingsfilm.","Überzeug uns, dass Frühstück die beste Mahlzeit ist.","Überzeug uns, mehr spazieren zu gehen.","Überzeug uns, deine Stadt zu besuchen.","Überzeug uns, dass Pausen produktiv sind.","Überzeug uns von deiner Lieblingsmusik.","Überzeug uns, ein neues Hobby anzufangen.","Überzeug uns, heute früher schlafen zu gehen.","Empfiehl uns ein Essen, das jeder einmal probieren sollte."]),...Cr("Erzählen",["Erzähl von einem Ort, an dem du dich frei fühlst.","Erzähl, was dich diese Woche zum Lachen gebracht hat.","Erzähl von einem Menschen, den du bewunderst, und warum.","Erzähl von deinem schönsten Ferientag als Kind.","Erzähl von einer Begegnung mit einem Fremden, die du nicht vergisst.","Erzähl von einem Moment, in dem du mutig warst.","Erzähl von deinem Lieblingsessen und wer es für dich gekocht hat.","Erzähl von einem Tag, an dem alles schiefging, und wie er endete.","Erzähl von einem Geschenk, das dir viel bedeutet.","Erzähl von einer Reise, die dich verändert hat."]),...Cr("Erklären",["Erklär einem Kind, was du bei der Arbeit machst.","Erklär, wie man den perfekten Kaffee macht.","Erklär einem Touristen, wie man sich in deiner Stadt zurechtfindet.","Erklär, warum Schlaf so wichtig ist.","Erklär die Regeln deines Lieblingsspiels.","Erklär, wie man einen Fahrradreifen flickt.","Erklär einem Freund, wie zyklisches Seufzen geht.","Erklär, was ein gutes Gespräch ausmacht.","Verrat uns einen Tipp, der dein Leben leichter gemacht hat."]),...Cr("Sinatra-Moment",["Begrüß dein Publikum, als wärst du Sinatra in Las Vegas.","Kündige den nächsten Song an, als wärst du Showmaster in den 60ern.","Erzähl, warum dich eine bestimmte Stimme fasziniert.","Moderier einen Abend mit Live-Musik, ganz entspannt und charmant.","Verabschiede dein Publikum nach einem großen Konzert.","Bedank dich beim Orchester, als wärst du der Star des Abends."]),...Cr("Meinung",["Was ist wichtiger: Talent oder Übung? Sag deine Meinung.","Sollte man im Urlaub erreichbar sein? Begründe deine Meinung.","Stadt oder Land: Wo lebt man besser?","Ist Pünktlichkeit überbewertet? Sag, was du denkst.","Sollten Handys beim Essen weg? Begründe es.","Morgenmensch oder Nachtmensch: Was ist besser?","Was macht einen guten Chef aus?"]),...Cr("Fantasie",["Du hast eine Zeitmaschine. Wohin reist du und warum?","Du darfst ein Restaurant eröffnen. Wie sieht es aus?","Du bist für einen Tag Bürgermeister. Was änderst du?","Du wachst in einer fremden Stadt auf. Was machst du zuerst?","Du gewinnst eine Reise für zwei. Wen nimmst du mit?","Du darfst ein Lied für die ganze Welt spielen. Welches und warum?"])],cn=(t,a)=>a.map(([r,e])=>({level:t,title:r,text:e})),gd=[...cn(1,[["Drei Mini-Sätze","Sprich heute drei fremde Menschen kurz an: Frag, wo etwas steht, grüß jemanden mit einem Satz und wünsch an der Kasse einen schönen Tag."],["Nach dem Weg fragen","Frag eine fremde Person nach dem Weg oder nach der Uhrzeit, auch wenn du es eigentlich weißt. Bedank dich mit einem ganzen Satz."],["Ein kleines Kompliment","Mach heute einer fremden Person ein ehrliches, kleines Kompliment, zum Beispiel zu einer Jacke oder einem Hund."],["Klar bestellen","Bestell heute irgendwo etwas mit ruhiger, klarer Stimme und schau dabei die Person an."],["Einen Satz mehr","Grüß heute zwei Nachbarn oder Kollegen mit einem Satz mehr als sonst, zum Beispiel: „Schönen Feierabend nachher!“"],["Um Rat fragen","Frag im Laden nach einer Empfehlung, zum Beispiel welches Brot heute am besten ist."]]),...cn(2,[["Eine echte Rückfrage","Stell einer fremden Person eine echte Frage, zum Beispiel wie ihr Tag läuft, und hör dir die Antwort ganz an."],["Smalltalk übers Wetter","Sag einer fremden Person etwas zum Wetter und stell eine Frage hinterher."],["Nachfragen statt nicken","Wenn dir heute jemand etwas erzählt, stell eine Nachfrage, bevor du antwortest."],["Eine Empfehlung geben","Empfiehl heute jemandem etwas, das du magst, und nenn einen Grund dafür."],["Anrufen statt schreiben","Ruf heute irgendwo an, wo du sonst eine Nachricht schreiben würdest, und frag etwas."],["Zwei ehrliche Sätze","Wenn dich heute jemand fragt, wie es dir geht, antworte mit zwei ehrlichen Sätzen statt nur mit „gut“."]]),...cn(3,[["Ein echter Moment","Bemerk etwas Echtes und sprich es aus, so wie bei den Croques. Einmal bei der Arbeit, einmal woanders."],["Etwas Gutes benennen","Sag heute einer Person, was dir an ihr oder ihrer Arbeit positiv aufgefallen ist."],["Eine kleine Geschichte","Erzähl heute jemandem in drei Sätzen etwas, das dir gestern passiert ist."],["Lachen teilen","Wenn dich heute etwas zum Schmunzeln bringt, sprich es laut aus, statt es nur zu denken."],["Meinung sagen","Sag heute einmal deine ehrliche Meinung zu etwas Kleinem, zum Beispiel zu Musik oder Essen."],["Danke mit Grund","Bedank dich heute bei jemandem und sag dazu, warum es dir geholfen hat."]]),...cn(4,[["Unter Freunden","Erzähl Freunden eine kleine Beobachtung aus deinem Tag, drei bis vier Sätze. Schau dabei in ihre Gesichter."],["Das Thema setzen","Fang bei Freunden heute selbst ein Thema an, statt zu warten, bis jemand anderes etwas sagt."],["Eine Frage in die Runde","Stell in einer Gruppe eine Frage an alle und hör dir die Antworten an."],["Eine gemeinsame Erinnerung","Erzähl Freunden eine lustige Erinnerung, die ihr zusammen habt."],["Zu Ende sprechen","Erzähl Freunden etwas und sprich bis zum Ende, auch wenn jemand dazwischenredet. Freundlich, aber ganz."],["Sprachnachricht","Schick einem Freund eine Sprachnachricht von 30 Sekunden statt einer Textnachricht."]]),...cn(5,[["Bewusst langsam","Sprich in einem Gespräch absichtlich langsamer, obwohl der Impuls „schneller“ sagt. Beobachte, was wirklich passiert."],["Pause aushalten","Mach mitten in einem Satz bewusst zwei Sekunden Pause. Beobachte, wie dein Gegenüber reagiert."],["Blick halten","Halte in einem Gespräch den Blickkontakt bis zum Ende deines Satzes."],["Ohne Entschuldigung","Wenn du dich heute versprichst, sag den Satz einfach nochmal, ohne dich zu entschuldigen."],["Eine Minute am Stück","Erzähl heute einmal mindestens eine Minute am Stück, ohne abzukürzen."],["In der Runde","Sag heute in einer Gruppe von drei oder mehr Menschen einen ganzen Gedanken laut."]])],Jo=t=>gd.filter(a=>a.level===t),Ds=t=>gd.find(a=>a.title===t),Yk=Fo.length+Fr.length+ld.length+dd.length+cd.length+hn.length+gd.length;var Ns=[{id:1,label:"Ruhe & Atem"},{id:2,label:"Fokus statt Kopfkino"},{id:3,label:"Tempo & Klarheit"},{id:4,label:"Stimme & Melodie"}],Os=[2,4],Po={text:{list:Fo,label:"Dein Text",shuffle:"Anderer Text",salt:0,reading:!0},textEmphasis:{list:Fo,label:"Dein Text",shuffle:"Anderer Text",salt:20,reading:!0,marked:!0},questions:{list:Fr,label:"Deine Frage",shuffle:"Neue Frage",salt:0},clear:{list:ld,label:"Deine Aufgabe",shuffle:"Andere Aufgabe",salt:0},melody:{list:dd,label:"Dein Satz",shuffle:"Anderer Satz",salt:0,marked:!0,quote:!0},calm:{list:cd,label:"Dein Satz",shuffle:"Anderer Satz",salt:0,quote:!0}},Us=["Tief durch die Nase einatmen.","Oben kurz nachatmen, ein zweiter kleiner Zug.","Langsam durch den Mund aus, länger als das Einatmen."],Zs="Balban, Spiegel, Huberman u. a., Stanford, Cell Reports Medicine 2023",_s={id:"warmup-sigh",kind:"breath",tag:"Neurowissenschaft · Ankommen",title:"Zyklisches Seufzen",minutes:1,seconds:57,cycles:6,steps:Us,why:"Langes Ausatmen aktiviert das Ruhesystem des Körpers und bremst den Puls. Ein ruhiger Atem ist der Treibstoff für ruhiges Sprechen.",source:Zs},qs={1:[{id:"sigh",kind:"breath",tag:"Neurowissenschaft · Atem",title:"Zyklisches Seufzen",minutes:3,seconds:171,cycles:18,steps:Us,why:"In der Stanford-Studie hob diese Atmung die Stimmung stärker als Achtsamkeitsmeditation und senkte die Atemfrequenz in Ruhe. Geübt wurde 5 Minuten täglich.",source:Zs},{id:"sss",kind:"hold",tag:"Stimmtraining · Atem",title:"Atem für lange Sätze",minutes:3,seconds:180,steps:["Kurz durch die Nase einatmen.","Kreis halten und leise auf „{laut}“ ausatmen.","Loslassen, wenn die Luft ausgeht. Nicht pressen."],why:"Sinatra ging auf frühen Radioaufnahmen hörbar die Luft aus. Er trainierte gezielt seine Atemkontrolle und sang danach deutlich längere Phrasen.",source:"Jazz History Online; Sinatra in LIFE (1965) über Tommy Dorsey"}],2:[{id:"att",kind:"timer",tag:"Psychologie · Metakognitive Therapie",title:"Aufmerksamkeit lenken",minutes:3,seconds:180,steps:["Blick auf einen Punkt. Minute 1: ein Geräusch halten.","Minute 2: alle paar Sekunden zu einem anderen springen.","Minute 3: alle Geräusche gleichzeitig hören."],phases:[{at:0,label:"Ein Geräusch halten"},{at:60,label:"Zwischen Geräuschen springen"},{at:120,label:"Alles gleichzeitig hören"}],why:"Trainiert, deine Aufmerksamkeit bewusst nach außen zu lenken, statt dich selbst zu beobachten. Genau das brauchst du mitten im Gespräch.",source:"Adrian Wells, Univ. Manchester: Attention Training Technique (Kurzform, Original 12 Min.)"},{id:"meditation",kind:"timer",tag:"Neurowissenschaft · Achtsamkeit",title:"Atem-Meditation",minutes:3,seconds:180,steps:["{anker}","Abgeschweift? Tippe auf „Zurück zum Atem“.","Sanft zurückkommen. Jede Rückkehr ist eine Wiederholung."],counterLabel:"Zurück zum Atem",why:"Nach einem Achtsamkeitstraining waren Menschen mit sozialer Angst weniger ängstlich und sahen sich positiver. Ihre Amygdala reagierte ruhiger auf negative Gedanken über sich selbst.",source:"Goldin & Gross, Stanford, Emotion 2010"}],3:[{id:"units",kind:"speak",tag:"Sprecherziehung · Tempo",title:"Lesen in Sinneinheiten",minutes:3,seconds:90,content:"text",steps:["Langsamer, als es sich richtig anfühlt.","Bei jedem / kurz stoppen und nachatmen.","Wortenden sauber, das Satzende sinkt."],why:"Angst belegt einen Teil des Arbeitsgedächtnisses, der dann fürs Formulieren fehlt. Pausen an Sinngrenzen geben dir Zeit zum Atmen und Denken.",source:"Eysenck u. a., Attentional Control Theory, Emotion 2007"},{id:"clear",kind:"speak",tag:"Linguistik · Klare Sprache",title:"Klar statt weich",minutes:3,seconds:60,content:"clear",steps:["Kein „irgendwie“, „vielleicht“ oder „ähm“.","Jedes Satzende sinkt wie ein Punkt.","Lieber kurz schweigen als füllen."],why:"In Studien wirkten Sprecher mit Zögerlauten, Weichmachern und Frage-Betonung weniger überzeugend und weniger kompetent.",source:"Erickson, Lind, Johnson & O’Barr, 1978"},{id:"prep",kind:"speak",tag:"Rhetorik · Struktur",title:"Gedanken ordnen",minutes:3,seconds:60,content:"questions",steps:["Punkt: deine Aussage in einem Satz.","Grund und Beispiel: warum, was erlebt?","Punkt: Aussage wiederholen. Fertig."],why:"Die PREP-Struktur entlastet den Kopf. Du musst nicht überlegen, was als Nächstes kommt, nur noch, was du sagen willst.",source:"Spontanrede-Training, z. B. „Table Topics“ bei Toastmasters"}],4:[{id:"sinatra",kind:"speak",tag:"Sinatra · Phrasierung",title:"Sprechen wie Sinatra",minutes:3,seconds:90,content:"textEmphasis",steps:["Markiertes Wort länger und wärmer.","Nach jedem Punkt innerlich „eins“ zählen.","Sprich zu einer Person, nicht zu vielen."],why:"Sinatra stellte den Text an erste Stelle: erst verstehen, dann entscheiden, wo betont und wo leise wird. Oft sang er minimal hinter dem Takt. Das klingt entspannt statt gehetzt.",source:"Sinatra-Zitat in Elsewhere; Wikipedia: Frank Sinatra’s recorded legacy"},{id:"melody",kind:"speak",tag:"Stimmforschung · Melodie",title:"Melodie-Leiter",minutes:3,seconds:60,content:"melody",steps:["20 Sekunden summen, Ton gleiten lassen.","Satz erst ganz flach, dann übertrieben.","Dann halb so viel. Betonung auf den markierten Wörtern."],why:"Ob eine Stimme lebendig und charismatisch wirkt, hängt stark an der Tonhöhe und ihrer Variation, am Tempo und an der Lautstärke. Studien zeigen: Charisma lässt sich trainieren.",source:"Frontiers in Communication 2020; Antonakis u. a. 2011; Summen: Titze 2006"},{id:"dj",kind:"speak",tag:"Praxis · FBI-Verhandlung",title:"Ruhige Stimme",minutes:3,seconds:60,content:"calm",steps:["Etwas tiefer ansetzen, langsam, warm.","Jedes Satzende sinkt nach unten.","Leicht lächeln. Das hört man."],why:"Der frühere FBI-Verhandler Chris Voss nutzt diese tiefe, langsame Stimme mit fallenden Satzenden, um angespannte Gespräche zu beruhigen.",source:"Chris Voss, „Never Split the Difference“; CNBC 2020"}]},Gs=[{label:"Vorher",text:"Zweimal seufzen, dann leise: „Ich bin aufgeregt.“"},{label:"Dabei",text:"Wenn ich abschweife, atme ich aus und schaue auf ein Detail vor mir."},{label:"Danach",text:"Was hatte ich befürchtet, und was ist wirklich passiert?"}],pd={why:"Selbstvertrauen wächst am stärksten durch gemeisterte Erfahrungen. Du musst nicht warten, bis du dich bereit fühlst.",source:"Bandura 1977; Brooks 2014; Gollwitzer 1999; Clark & Wells 1995"},Ys=[{id:"better",label:"Besser als befürchtet"},{id:"expected",label:"Wie erwartet"},{id:"harder",label:"Schwieriger als gedacht"},{id:"notyet",label:"Noch nicht gemacht"}],fd={why:"Angst macht Vorhersagen. Hier sammelst du Beweise, ob sie stimmen.",source:"Clark & Wells 1995: Verhaltensexperimente"},Xs=["Zweimal seufzen: doppelt ein, lang aus.","Leise sagen: „Ich bin aufgeregt.“"],kd={why:"Aufregung umdeuten statt unterdrücken: In Harvard-Studien schnitten Menschen damit beim Reden besser ab als mit dem Versuch, sich zu beruhigen.",source:"Alison Wood Brooks, Harvard, 2014"},Rs=["Hör dir die Aufnahme an wie eine fremde Person.","Achte nur auf drei Dinge: Pausen, Satzenden, Tempo.","Merk dir einen Punkt fürs nächste Mal."],vd={why:"Wie wir uns fühlen und wie wir klingen, liegt oft weit auseinander. Aufnahmen zeigen dir die Wirklichkeit statt das Kopfkino.",source:"Clark & Wells: Video-Feedback in der Therapie sozialer Angst"},$o=60,xd={why:"Menschen reagieren sogar auf ein rein virtuelles Publikum, als wäre es echt. Darum wirkt das Üben vor vorgestellten Zuhörern. Entscheidend ist der Vergleich: Was hast du befürchtet, und was ist passiert?",source:"Slater, Pertaub & Steed 1999; Craske u. a. 2014; Skala 0–10 nach Wolpe 1969"},Ld=[{title:"Neurowissenschaft",items:[{who:"Balban, Spiegel, Huberman u. a. (2023)",what:"Zyklisches Seufzen: 5 Minuten täglich hoben die Stimmung stärker als Achtsamkeitsmeditation und senkten die Atemfrequenz in Ruhe. Cell Reports Medicine.",url:"https://doi.org/10.1016/j.xcrm.2022.100895"},{who:"Goldin & Gross (2010)",what:"Achtsamkeitstraining bei sozialer Angst: weniger Angst, besseres Selbstbild, ruhigere Amygdala bei negativen Gedanken über sich selbst. Emotion.",url:"https://pubmed.ncbi.nlm.nih.gov/20141305/"}]},{title:"Psychologie & Psychotherapie",items:[{who:"Clark & Wells (1995)",what:"Kognitives Modell sozialer Angst: Selbstbeobachtung und Sicherheitsverhalten halten die Angst aufrecht. Behandlung mit Video-Feedback, Fokus nach außen und Verhaltensexperimenten.",url:"https://www.sciencedirect.com/science/article/pii/S1077722916300232"},{who:"Wells: Attention Training Technique",what:"Übersichtsarbeit zur Wirksamkeit des Aufmerksamkeitstrainings (K
